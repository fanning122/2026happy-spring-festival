<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMG Happy Spring Festival</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            flex-direction: column; /* 改为垂直排列 */
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: 'Arial Black', 'Arial', sans-serif;
            overflow: auto; /* 改为auto以允许滚动 */
            padding: 20px;
            position: relative; /* 为absolute定位的背景容器提供参考 */
            /* 为固定播放器控制栏留出顶部空间 */
            padding-top: 70px;
        }
        
        /* ===== 新增：媒体播放器控制栏样式 ===== */
        .media-player {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 580px;
            height: 50px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border: 2px solid #ffd700;
            backdrop-filter: blur(5px);
        }
        
        /* 控制按钮样式 */
        .control-btn {
            background: linear-gradient(135deg, #ffd700, #daa520);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }
        
        .control-btn:hover {
            transform: scale(1.1);
            background: linear-gradient(135deg, #ffec8b, #ffd700);
        }
        
        .control-btn.active {
            background: linear-gradient(135deg, #ff4500, #ff6347);
            color: white;
        }
        
        /* 进度条容器 */
        .progress-container {
            flex: 1;
            margin: 0 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* 时间显示 */
        .time-display {
            display: flex;
            justify-content: space-between;
            width: 100%;
            color: #ffd700;
            font-size: 12px;
            margin-bottom: 5px;
            font-family: monospace;
        }
        
        /* 进度条样式 */
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 215, 0, 0.3);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .progress {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ff4500);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
        }
        
        .progress-bar:hover .progress {
            background: linear-gradient(90deg, #ffec8b, #ff6347);
        }
        
        /* 隐藏的媒体元素 */
        .hidden-media {
            display: none; /* 完全隐藏，通过修改CSS解除隐藏 */
            position: absolute;
            top: -9999px;
            left: -9999px;
        }
        
        /* 响应式调整 */
        @media (max-width: 768px) {
            .media-player {
                width: 90%;
                max-width: 580px;
            }
            
            body {
                padding-top: 60px;
            }
        }
        
        @media (max-width: 480px) {
            .media-player {
                width: 95%;
                height: 45px;
                padding: 0 10px;
            }
            
            .control-btn {
                width: 35px;
                height: 35px;
                font-size: 16px;
            }
            
            .time-display {
                font-size: 10px;
            }
        }
        
        .container {
            perspective: 1000px;
            text-align: center;
            margin-bottom: 0px; /* 增加与logo的间距 */
        }
        
        .year-3d {
            display: inline-block;
            font-size: 180px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 
                5px 5px 0 rgba(0, 0, 0, 0.3),
                10px 10px 20px rgba(0, 0, 0, 0.5);
            transform-style: preserve-3d;
            animation: float 6s ease-in-out infinite;
            letter-spacing: 15px;
        }
        
        .year-3d span {
            display: inline-block;
            position: relative;
            text-transform: uppercase;
            transform-style: preserve-3d;
        }
        
        /* 3D立体效果 */
        .year-3d span::before,
        .year-3d span::after {
            content: attr(data-digit);
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
        }
        
        .year-3d span::before {
            color: rgba(255, 215, 0, 0.5);
            transform: translateZ(-30px);
            z-index: -1;
        }
        
        .year-3d span::after {
            color: rgba(255, 140, 0, 0.7);
            transform: translateZ(-15px);
            z-index: -2;
        }
        
        /* 霓虹边框效果 */
        .neon-border {
            position: relative;
            padding: 20px;
            border-radius: 20px;
        }
        
        /* 金属质感增强 */
        .metal-effect {
            background: linear-gradient(
                135deg,
                #ffd700 0%,
                #ffec8b 25%,
                #ffd700 50%,
                #daa520 75%,
                #b8860b 100%
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            background-size: 200% auto;
            animation: shine 3s linear infinite;
        }
        
        /* 悬浮动画 */
        @keyframes float {
            0%, 100% {
                transform: rotateX(15deg) rotateY(0deg) translateY(0);
            }
            50% {
                transform: rotateX(15deg) rotateY(10deg) translateY(-20px);
            }
        }
        
        /* 金属光泽动画 */
        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }
        
        /* 响应式调整 */
        @media (max-width: 768px) {
            .year-3d {
                font-size: 120px;
                letter-spacing: 3px;
            }
        }
        
        @media (max-width: 480px) {
            .year-3d {
                font-size: 80px;
                letter-spacing: 0px;
            }
        }
        
        /* 闪烁效果 */
        .glow {
            animation: pulse 4s ease-in-out infinite;
            z-index: -1;
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 0.3;
            }
            50% {
                opacity: 0.7;
            }
        }
        
        .subtitle {
            margin-top: 80px;
            color: red;
            font-size: 50px;
            opacity: 0.88;
            /* 新增：为动画添加定位和变换原点 */
            position: relative;
            transform-origin: center top; /* 从顶部中心点缩放，避免影响下方元素 */
            z-index: 1;
            /* 初始动画：从下方进入（等待logo动画一半后开始） */
            animation: 
                subtitleEnter 2s ease-out 1.5s both, /* 出场动画：2秒时长，延迟1.5秒开始 */
                subtitleLoop 5s ease-in-out 3.5s infinite; /* 循环动画：延迟3.5秒开始（1.5s + 2s） */
        }
        
        /* Logo容器样式 - 添加在现有CSS之后，不修改现有部分 */
        .logo {
            text-align: center;
            margin-top: 0px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .logo img {
            max-width: 580px;
            width: 100%;
            height: auto;
            border-radius: 0px;
            transition: transform 0.3s ease;
        }
        
        .logo img:hover {
            transform: scale(1.02);
        }
        
        /* 手机端调整 */
        @media (max-width: 768px) {
            .logo img {
                max-width: 450px;
            }
        }
        
        @media (max-width: 480px) {
            .logo img {
                max-width: 380px;
            }
            .subtitle {
                font-size: 29px;
            }
        }
        
        /* ===== 新增的Background容器样式 ===== */
        /* 在现有CSS之后添加，不修改现有部分 */
        .background {
            position: absolute;
            top: 50%; /* 垂直居中 */
            left: 50%; /* 水平居中 */
            transform: translate(-50%, -50%); /* 精确居中 */
            z-index: -1; /* 确保在最底层 */
            width: 100%;
            text-align: center;
            pointer-events: none; /* 防止干扰上层交互 */
        }
        
        .background img {
            max-width: 680px;
            width: 90%; /* 相对宽度，适应不同屏幕 */
            height: auto;
            /* 移除透明度和模糊效果，保持清晰 */
            opacity: 1;
            filter: none;
        }
        
        /* 背景位置调整 - 可以通过修改这里的值上下移动背景 */
        /* 当前设置为居中，可以改为 top: 45%; 或 top: 55%; 来调整 */
        .background {
            top: 45%; /* 默认居中，可调整为 45%, 55% 等 */
        }
        
        /* 响应式调整 */
        @media (max-width: 768px) {
            .background img {
                max-width: 450px;
                opacity: 1; /* 保持完全不透明 */
            }
        }
        
        @media (max-width: 480px) {
            .background img {
                max-width: 350px;
                opacity: 1; /* 保持完全不透明 */
            }
        }
        
        /* ===== 新增：Subtitle动画关键帧 ===== */
        /* Subtitle进入动画 - 从下方滑入 */
        @keyframes subtitleEnter {
            0% {
                transform: translateY(100px) scale(1); /* 从下方100px开始 */
                opacity: 0;
            }
            100% {
                transform: translateY(0) scale(1); /* 到达最终位置 */
                opacity: 0.88;
            }
        }
        
        /* Subtitle循环动画 - 缩放和淡入淡出 */
        /* 修改关键：在80%到100%之间添加opacity的渐变过程 */
        @keyframes subtitleLoop {
            /* 阶段1: 50px → 150px 放大 (0-3秒) - 60% */
            0% {
                transform: scale(1); /* 1倍 = 50px */
                opacity: 0.88;
            }
            60% {
                transform: scale(3); /* 3倍 = 150px (50px * 3) */
                opacity: 0.88;
            }
            
            /* 阶段2: 150px → 160px + 淡出 (3-4秒) - 60%到80% */
            60%, 79.999% {
                transform: scale(3.2); /* 3.2倍 = 160px (50px * 3.2) */
                opacity: 0; /* 完全淡出 */
            }
            
            /* 关键修改点：在80%处scale值直接从3.2跳变到1，opacity开始淡入 */
            80% {
                transform: scale(1); /* 直接跳变回1倍 = 50px */
                opacity: 0; /* 开始淡入（完全透明） */
            }
            
            /* 新增：在90%处设置中间透明度，确保渐变可见 */
            90% {
                transform: scale(1); /* 保持50px大小 */
                opacity: 0.44; /* 中间透明度（0.88的一半） */
            }
            
            /* 阶段3: 保持50px大小并完成淡入 (4-5秒) - 80%到100% */
            100% {
                transform: scale(1); /* 保持50px大小 */
                opacity: 0.88; /* 淡入完成 */
            }
        }
    </style>
</head>
<body>
    <!-- 新增：媒体播放器控制栏 -->
    <div class="media-player">
        <!-- 播放/暂停按钮 -->
        <button class="control-btn" id="playPauseBtn">▶</button>
        
        <!-- 进度条区域 -->
        <div class="progress-container">
            <div class="time-display">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>
            <div class="progress-bar" id="progressBar">
                <div class="progress" id="progress"></div>
            </div>
        </div>
        
        <!-- 循环播放按钮 -->
        <button class="control-btn" id="loopBtn">🔁</button>
    </div>
    
    <!-- 隐藏的媒体元素 -->
    <div class="hidden-media">
        <!-- 默认播放排列在第一的文件 -->
        <audio id="mediaPlayer" controls>
            <source src="congratulationprosperous.mp4" type="audio/mpeg">
            <source src="media/audio.ogg" type="audio/ogg">
            您的浏览器不支持音频播放
        </audio>
        
        <!-- 备用视频播放器（如果需要视频支持） -->
        <!--
        <video id="videoPlayer" controls style="display:none;">
            <source src="media/video.mp4" type="video/mp4">
            <source src="media/video.webm" type="video/webm">
            您的浏览器不支持视频播放
        </video>
        -->
    </div>

    <!-- 新增的Background容器 - z轴最底层 -->
    <div class="background">
        <img src="background001.png" alt="背景图案">
    </div>
    
    <!-- 现有的Container容器 -->
    <div class="container">
        <div class="neon-border">
            <div class="glow"></div>
            <div class="year-3d">
                <span class="metal-effect" data-digit="2">2</span>
                <span class="metal-effect" data-digit="0">0</span>
                <span class="metal-effect" data-digit="2">2</span>
                <span class="metal-effect" data-digit="6">6</span>
            </div>
        </div>
        <div class="subtitle">Happy Spring Festival</div>
    </div>

    <!-- 现有的Logo容器 -->
    <div class="logo">
        <img src="MyCardEnglish.png" alt="CMG Logo">
    </div>

    <script>
        // ===== 媒体播放器功能 =====
        const mediaPlayer = document.getElementById('mediaPlayer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const loopBtn = document.getElementById('loopBtn');
        const progressBar = document.getElementById('progressBar');
        const progress = document.getElementById('progress');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        
        let isPlaying = false;
        let isLooping = false;
        
        // 格式化时间（秒 → 分:秒）
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }
        
        // 更新进度条
        function updateProgress() {
            if (!mediaPlayer.duration) return;
            
            const percent = (mediaPlayer.currentTime / mediaPlayer.duration) * 100;
            progress.style.width = `${percent}%`;
            
            currentTimeEl.textContent = formatTime(mediaPlayer.currentTime);
            durationEl.textContent = formatTime(mediaPlayer.duration);
        }
        
        // 设置播放进度
        function setProgress(e) {
            const width = progressBar.clientWidth;
            const clickX = e.offsetX;
            const duration = mediaPlayer.duration;
            
            mediaPlayer.currentTime = (clickX / width) * duration;
        }
        
        // 切换播放/暂停
        function togglePlayPause() {
            if (isPlaying) {
                mediaPlayer.pause();
                playPauseBtn.textContent = '▶';
            } else {
                mediaPlayer.play().catch(e => {
                    console.log('播放被阻止:', e);
                    // 可以在这里添加用户交互提示
                });
                playPauseBtn.textContent = '⏸';
            }
            isPlaying = !isPlaying;
        }
        
        // 切换循环模式
        function toggleLoop() {
            isLooping = !isLooping;
            mediaPlayer.loop = isLooping;
            loopBtn.classList.toggle('active', isLooping);
        }
        
        // 监听媒体事件
        mediaPlayer.addEventListener('timeupdate', updateProgress);
        mediaPlayer.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(mediaPlayer.duration);
            updateProgress();
        });
        mediaPlayer.addEventListener('ended', () => {
            if (!isLooping) {
                isPlaying = false;
                playPauseBtn.textContent = '▶';
            }
        });
        
        // 绑定事件
        playPauseBtn.addEventListener('click', togglePlayPause);
        loopBtn.addEventListener('click', toggleLoop);
        progressBar.addEventListener('click', setProgress);
        
        // 添加键盘快捷键支持（空格键播放/暂停）
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlayPause();
            }
        });
        
        // ===== 原有的页面交互功能 =====
        // 添加鼠标互动效果
        document.querySelector('.year-3d').addEventListener('mousemove', function(e) {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            
            this.style.transform = `rotateX(${15 + yAxis}deg) rotateY(${xAxis}deg)`;
        });
        
        // 添加点击效果
        document.querySelector('.year-3d').addEventListener('click', function() {
            this.style.animation = 'none';
            this.style.transform = 'rotateX(20deg) rotateY(20deg) scale(1.1)';
            
            setTimeout(() => {
                this.style.animation = 'float 6s ease-in-out infinite';
            }, 500);
        });
        
        // 让数字逐个出现
        document.addEventListener('DOMContentLoaded', function() {
            const digits = document.querySelectorAll('.year-3d span');
            digits.forEach((digit, index) => {
                digit.style.opacity = '0';
                digit.style.transform = 'translateY(50px)';
                
                setTimeout(() => {
                    digit.style.transition = 'opacity 0.8s ease, transform 0.8s ease';
                    digit.style.opacity = '1';
                    digit.style.transform = 'translateY(0)';
                }, index * 200);
            });
            
            // 添加logo图片加载动画
            const logoImg = document.querySelector('.logo img');
            if (logoImg) {
                logoImg.style.opacity = '0';
                logoImg.style.transform = 'translateY(30px)';
                
                setTimeout(() => {
                    logoImg.style.transition = 'opacity 1s ease, transform 1s ease';
                    logoImg.style.opacity = '1';
                    logoImg.style.transform = 'translateY(0)';
                }, 1000); // logo动画延迟1秒开始
            }
            
            // 添加背景图片加载动画 - 保持不透明
            const bgImg = document.querySelector('.background img');
            if (bgImg) {
                bgImg.style.opacity = '0';
                bgImg.style.transition = 'opacity 1s ease';
                
                setTimeout(() => {
                    bgImg.style.opacity = '1'; /* 完全不透明 */
                }, 500);
            }
            
            // 初始化媒体播放器（不自动播放）
            updateProgress();
        });
    </script>
</body>
</html>
