<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMG Happy Spring Festival</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: 'Arial Black', 'Arial', sans-serif;
            overflow: auto;
            padding: 20px;
            position: relative;
            padding-top: 0;
        }
        
        /* 媒体播放器控制栏样式 */
        .media-player {
            position: fixed;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 580px;
            height: 50px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }
        
        .control-btn {
            background: linear-gradient(135deg, #ffd700, #daa520);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }
        
        .control-btn:hover {
            transform: scale(1.1);
            background: linear-gradient(135deg, #ffec8b, #ffd700);
        }
        
        .control-btn.active {
            background: linear-gradient(135deg, #ff4500, #ff6347);
            color: white;
        }
        
        .progress-container {
            flex: 1;
            margin: 0 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .time-display {
            display: flex;
            justify-content: space-between;
            width: 100%;
            color: #ffd700;
            font-size: 12px;
            margin-bottom: 5px;
            font-family: monospace;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 215, 0, 0.3);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .progress {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ff4500);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
        }
        
        .progress-bar:hover .progress {
            background: linear-gradient(90deg, #ffec8b, #ff6347);
        }
        
        .hidden-media {
            display: none;
            position: absolute;
            top: -9999px;
            left: -9999px;
        }
        
        @media (max-width: 768px) {
            .media-player {
                width: 90%;
                max-width: 580px;
            }
        }
        
        @media (max-width: 480px) {
            .media-player {
                width: 95%;
                height: 45px;
                padding: 0 10px;
            }
            
            .control-btn {
                width: 35px;
                height: 35px;
                font-size: 16px;
            }
            
            .time-display {
                font-size: 10px;
            }
        }
        
        .container {
            perspective: 1000px;
            text-align: center;
            margin-bottom: 0px;
        }
        
        .year-3d {
            display: inline-block;
            font-size: 180px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 
                5px 5px 0 rgba(0, 0, 0, 0.3),
                10px 10px 20px rgba(0, 0, 0, 0.5);
            transform-style: preserve-3d;
            animation: float 6s ease-in-out infinite;
            letter-spacing: 15px;
        }
        
        .year-3d span {
            display: inline-block;
            position: relative;
            text-transform: uppercase;
            transform-style: preserve-3d;
        }
        
        .year-3d span::before,
        .year-3d span::after {
            content: attr(data-digit);
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
        }
        
        .year-3d span::before {
            color: rgba(255, 215, 0, 0.5);
            transform: translateZ(-30px);
            z-index: -1;
        }
        
        .year-3d span::after {
            color: rgba(255, 140, 0, 0.7);
            transform: translateZ(-15px);
            z-index: -2;
        }
        
        .neon-border {
            position: relative;
            padding: 20px;
            border-radius: 20px;
        }
        
        .metal-effect {
            background: linear-gradient(
                135deg,
                #ffd700 0%,
                #ffec8b 25%,
                #ffd700 50%,
                #daa520 75%,
                #b8860b 100%
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            background-size: 200% auto;
            animation: shine 3s linear infinite;
        }
        
        @keyframes float {
            0%, 100% {
                transform: rotateX(15deg) rotateY(0deg) translateY(0);
            }
            50% {
                transform: rotateX(15deg) rotateY(10deg) translateY(-20px);
            }
        }
        
        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }
        
        @media (max-width: 768px) {
            .year-3d {
                font-size: 120px;
                letter-spacing: 3px;
            }
        }
        
        @media (max-width: 480px) {
            .year-3d {
                font-size: 80px;
                letter-spacing: 0px;
            }
        }
        
        .glow {
            animation: pulse 4s ease-in-out infinite;
            z-index: -1;
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 0.3;
            }
            50% {
                opacity: 0.7;
            }
        }
        
        .logo {
            text-align: center;
            margin-top: -24px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .logo img {
            max-width: 580px;
            width: 100%;
            height: auto;
            border-radius: 0px;
            transition: transform 0.3s ease;
        }
        
        .logo img:hover {
            transform: scale(1.02);
        }
        
        @media (max-width: 768px) {
            .logo img {
                max-width: 450px;
            }
        }
        
        @media (max-width: 480px) {
            .logo img {
                max-width: 380px;
            }
        }
        
        .background {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            width: 100%;
            text-align: center;
            pointer-events: none;
        }
        
        .background img {
            max-width: 680px;
            width: 90%;
            height: auto;
            opacity: 1;
            filter: none;
        }
        
        .background {
            top: 380px;
        }
        
        @media (max-width: 768px) {
            .background {margin-top: auto;}
            .background img {
                max-width: 450px;
                opacity: 1;
            }
        }
        
        @media (max-width: 480px) {
            .background {top: 180px;}
            .logo {
                margin-top: -110px;
            }
            .background img {
                max-width: 350px;
                opacity: 1;
            }
        }
        
        .main-subtitle {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 120px;
        }
        
        .subtitle {
            color: red;
            font-size: 50px;
            opacity: 0.88;
            position: relative;
            transform-origin: center top;
            z-index: 1;
            animation: 
                subtitleEnter 2s ease-out 1.5s both,
                subtitleLoop 5s ease-in-out 3.5s infinite;
        }
        
        @keyframes subtitleEnter {
            0% {
                transform: translateY(100px) scale(1);
                opacity: 0;
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 0.88;
            }
        }
        
        @keyframes subtitleLoop {
            0% {
                transform: scale(1);
                opacity: 0.88;
            }
            60% {
                transform: scale(3);
                opacity: 0.88;
            }
            60%, 79.999% {
                transform: scale(3.2);
                opacity: 0;
            }
            80% {
                transform: scale(1);
                opacity: 0;
            }
            90% {
                transform: scale(1);
                opacity: 0.44;
            }
            100% {
                transform: scale(1);
                opacity: 0.88;
            }
        }
        
        @media (max-width: 480px) {
            .subtitle {
                top: -70px;
                font-size: 29px;
            }
        }
        
        .main-content {
            position: absolute;
            top: -2vh;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
        }
        
        @media (max-width: 768px) {
            .main-content {
                top: 30vh;
            }
        }
        
        @media (max-width: 480px) {
            .main-content {
                top: 2vh;
            }
        }
        
        /* ===== 修改：图片窗口容器样式 ===== */
        .image-window {
            margin-top: -80px;
            width: 100vw;
            display: flex;
            flex-direction: column; /* 垂直排列 */
            align-items: center; /* x轴居中对齐 */
            overflow: hidden;
            background: transparent;
            gap: 0; /* 无缝间距 */
            position: relative; /* 新增：启用z-index */
            z-index: -2; /* 新增：设为最低层 */
        }
        
        /* 原始图片（仅用于加载动画） */
        .image-window .original-img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            opacity: 0; /* 隐藏原图，只显示teleprompter */
            position: absolute;
            z-index: -1;
        }
        
        /* ===== TELEPROMPTER 滚动样式 ===== */
        .teleprompter-wrapper {
            position: relative;
            width: 430px;
            height: 500px;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            background: #000;
            touch-action: none; /* 禁用浏览器默认触摸行为 */
            cursor: grab;
            margin: 0 auto;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        .teleprompter-wrapper.loaded {
            opacity: 1;
        }
        
        .teleprompter-wrapper:active {
            cursor: grabbing;
        }
        
        .teleprompter-inner {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            will-change: transform; /* 性能优化 */
            transition: transform 0.1s linear;
        }
        
        .teleprompter-img-container {
            display: flex;
            flex-direction: column;
        }
        
        .teleprompter-img-container img {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none;
            user-select: none;
        }
        
        /* 进度条容器 - 复用播放器样式 */
        .teleprompter-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, rgba(15, 32, 39, 0.9), transparent);
            padding: 10px 15px;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .teleprompter-wrapper:hover .teleprompter-progress {
            opacity: 1;
        }
        
        .teleprompter-progress .time-display {
            margin-bottom: 0;
            justify-content: center;
        }
        
        .teleprompter-progress .progress-bar {
            margin-top: 5px;
            height: 4px;
            background: rgba(255, 215, 0, 0.3);
            border-radius: 2px;
        }
        
        .teleprompter-progress .progress {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ff4500);
            border-radius: 2px;
        }
        
        /* 边界阻尼效果 */
        .teleprompter-wrapper.boundary-top .teleprompter-inner,
        .teleprompter-wrapper.boundary-bottom .teleprompter-inner {
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        
        /* 确保两张图片之间无缝 */
        .image-window img:first-child {
            margin-bottom: 0;
        }
        
        .image-window img:last-child {
            margin-top: 0;
        }
        
        /* 响应式调整 */
        @media (max-width: 768px) {
            .image-window {
                max-width: 100vw;
                margin-left: calc(-50vw + 50%);
            }
        }
        
        @media (max-width: 480px) {
            .image-window {
                margin-top: -60px;
                width: 100vw;
                margin-left: calc(-50vw + 50%);
            }
            
            .teleprompter-wrapper {
                width: 90vw;
                max-width: 430px;
                height: 500px;
            }
        }
        
        /* 桌面端图片最大宽度限制 */
        @media (min-width: 769px) {
            .image-window img {
                max-width: 580px;
            }
            
            .teleprompter-wrapper {
                max-width: 430px;
            }
        }
    </style>
</head>
<body>
    <!-- 媒体播放器控制栏 -->
    <div class="media-player">
        <button class="control-btn" id="playPauseBtn">▶</button>
        
        <div class="progress-container">
            <div class="time-display">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>
            <div class="progress-bar" id="progressBar">
                <div class="progress" id="progress"></div>
            </div>
        </div>
        
        <button class="control-btn" id="loopBtn">🔁</button>
    </div>
    
    <!-- 隐藏的媒体元素 -->
    <div class="hidden-media">
        <audio id="mediaPlayer" controls>
            <source src="congratulationprosperous.mp4" type="audio/mpeg">
            <source src="media/audio.ogg" type="audio/ogg">
            您的浏览器不支持音频播放
        </audio>
    </div>

    <!-- 主内容包装器 -->
    <div class="main-content">
        <!-- Background容器 -->
        <div class="background">
            <img src="background001.png" alt="背景图案">
        </div>
        
        <!-- Container容器 -->
        <div class="container">
            <div class="neon-border">
                <div class="glow"></div>
                <div class="year-3d">
                    <span class="metal-effect" data-digit="2">2</span>
                    <span class="metal-effect" data-digit="0">0</span>
                    <span class="metal-effect" data-digit="2">2</span>
                    <span class="metal-effect" data-digit="6">6</span>
                </div>
            </div>
        </div>

        <!-- Main Subtitle容器 -->
        <div class="main-subtitle">
            <div class="subtitle">Happy Spring Festival</div>
        </div>

        <!-- Logo容器 -->
        <div class="logo">
            <img src="MyCardEnglish.png" alt="CMG Logo">
        </div>
        
        <!-- 图片窗口容器 - 包含teleprompter滚动效果 -->
        <div class="image-window">
            <!-- 原始图片（仅用于加载动画） -->
            <img src="Socialmap003.jpg" alt="展示图片1" class="original-img">
            
            <!-- Teleprompter滚动容器 -->
            <div class="teleprompter-wrapper loading">
                <div class="teleprompter-inner">
                    <div class="teleprompter-img-container">
                        <!-- 两张相同图片实现无缝循环 -->
                        <img src="Socialmap003.jpg" alt="展示图片1">
                        <img src="Socialmap003.jpg" alt="展示图片1">
                    </div>
                </div>
                
                <!-- 进度条（复用播放器样式） -->
                <div class="teleprompter-progress">
                    <div class="time-display">
                        <span class="progress-text">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== 媒体播放器功能 =====
        const mediaPlayer = document.getElementById('mediaPlayer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const loopBtn = document.getElementById('loopBtn');
        const progressBar = document.getElementById('progressBar');
        const progress = document.getElementById('progress');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        
        let isPlaying = false;
        let isLooping = false;
        
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }
        
        function updateProgress() {
            if (!mediaPlayer.duration) return;
            
            const percent = (mediaPlayer.currentTime / mediaPlayer.duration) * 100;
            progress.style.width = `${percent}%`;
            
            currentTimeEl.textContent = formatTime(mediaPlayer.currentTime);
            durationEl.textContent = formatTime(mediaPlayer.duration);
        }
        
        function setProgress(e) {
            const width = progressBar.clientWidth;
            const clickX = e.offsetX;
            const duration = mediaPlayer.duration;
            
            mediaPlayer.currentTime = (clickX / width) * duration;
        }
        
        function togglePlayPause() {
            if (isPlaying) {
                mediaPlayer.pause();
                playPauseBtn.textContent = '▶';
            } else {
                mediaPlayer.play().catch(e => {
                    console.log('播放被阻止:', e);
                });
                playPauseBtn.textContent = '⏸';
            }
            isPlaying = !isPlaying;
        }
        
        function toggleLoop() {
            isLooping = !isLooping;
            mediaPlayer.loop = isLooping;
            loopBtn.classList.toggle('active', isLooping);
        }
        
        mediaPlayer.addEventListener('timeupdate', updateProgress);
        mediaPlayer.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(mediaPlayer.duration);
            updateProgress();
        });
        mediaPlayer.addEventListener('ended', () => {
            if (!isLooping) {
                isPlaying = false;
                playPauseBtn.textContent = '▶';
            }
        });
        
        playPauseBtn.addEventListener('click', togglePlayPause);
        loopBtn.addEventListener('click', toggleLoop);
        progressBar.addEventListener('click', setProgress);
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlayPause();
            }
        });
        
        // ===== TELEPROMPTER 滚动控制器 =====
        class TeleprompterScroller {
            constructor(wrapper, options = {}) {
                this.wrapper = wrapper;
                this.inner = wrapper.querySelector('.teleprompter-inner');
                this.imgContainer = wrapper.querySelector('.teleprompter-img-container');
                this.progressBar = wrapper.querySelector('.progress-bar');
                this.progress = wrapper.querySelector('.progress');
                this.progressText = wrapper.querySelector('.progress-text');
                
                // ===== 可调节参数（请在此修改） =====
                this.options = {
                    totalSeconds: 60,          // 总滚动时间（秒）- 修改此处调整速度
                    dragDamping: 0.15,         // 拖动阻尼系数（0-1，越小阻尼越大）
                    doubleClickDelay: 300,     // 双击识别间隔（ms）
                    autoPlay: true,            // 初始自动播放
                    ...options
                };
                // ===== 可调节参数结束 =====
                
                this.imgs = this.imgContainer.querySelectorAll('img');
                this.isPlaying = this.options.autoPlay;
                this.isDragging = false;
                this.isTouching = false;
                
                // 滚动状态
                this.currentY = 0;
                this.targetY = 0;
                this.velocity = 0;
                this.animationId = null;
                this.lastTime = null;
                
                // 触摸/鼠标状态
                this.startY = 0;
                this.startTranslateY = 0;
                this.lastY = 0;
                this.lastTimestamp = 0;
                
                // 双击检测
                this.clickCount = 0;
                this.clickTimer = null;
                
                // 初始化
                this.init();
            }
            
            async init() {
                // 等待图片加载
                await this.waitForImages();
                
                // 计算尺寸
                this.containerHeight = this.wrapper.clientHeight;
                this.imgHeight = this.imgs[0].clientHeight;
                
                // 验证图片高度（基于您提供的6609.25px）
                console.log('图片高度:', this.imgHeight, 'px');
                console.log('容器高度:', this.containerHeight, 'px');
                
                // 计算滚动参数
                this.maxScroll = this.imgHeight - this.containerHeight;
                this.scrollSpeed = this.maxScroll / this.options.totalSeconds; // 像素/秒
                
                console.log('最大滚动距离:', this.maxScroll, 'px');
                console.log('滚动速度:', this.scrollSpeed.toFixed(2), '像素/秒');
                
                // 设置初始位置（顶部对齐）
                this.currentY = 0;
                this.targetY = 0;
                this.updateTransform();
                
                // 绑定事件
                this.bindEvents();
                
                // 移除loading状态，显示容器
                this.wrapper.classList.remove('loading');
                this.wrapper.classList.add('loaded');
                
                // 开始动画循环
                this.animate();
            }
            
            waitForImages() {
                return Promise.all(
                    Array.from(this.imgs).map(img => 
                        img.complete ? Promise.resolve() : new Promise(resolve => {
                            img.onload = resolve;
                            img.onerror = resolve;
                        })
                    )
                );
            }
            
            bindEvents() {
                // 触摸事件
                this.wrapper.addEventListener('touchstart', this.handleTouchStart.bind(this));
                this.wrapper.addEventListener('touchmove', this.handleTouchMove.bind(this));
                this.wrapper.addEventListener('touchend', this.handleTouchEnd.bind(this));
                
                // 鼠标事件
                this.wrapper.addEventListener('mousedown', this.handleMouseDown.bind(this));
                this.wrapper.addEventListener('wheel', this.handleWheel.bind(this), { passive: false });
                
                // 单击/双击处理
                this.wrapper.addEventListener('click', this.handleClick.bind(this));
                
                // 进度条点击
                const progressBar = this.wrapper.querySelector('.progress-bar');
                progressBar.addEventListener('click', this.handleProgressClick.bind(this));
                
                // 防止默认拖动行为
                this.wrapper.addEventListener('dragstart', e => e.preventDefault());
                
                // 窗口resize时重新计算
                window.addEventListener('resize', this.handleResize.bind(this));
            }
            
            // 主动画循环
            animate(timestamp) {
                if (!this.lastTime) this.lastTime = timestamp;
                
                const deltaTime = (timestamp - this.lastTime) / 1000; // 转换为秒
                this.lastTime = timestamp;
                
                if (this.isPlaying && !this.isDragging && !this.isTouching) {
                    // 自动滚动
                    this.targetY -= this.scrollSpeed * deltaTime;
                    
                    // 无缝循环检测（两张图片拼接）
                    if (this.targetY <= -this.imgHeight) {
                        this.targetY += this.imgHeight;
                        this.currentY += this.imgHeight;
                    }
                }
                
                // 平滑过渡到目标位置
                if (!this.isDragging && !this.isTouching) {
                    const diff = this.targetY - this.currentY;
                    this.velocity = diff * 0.1; // 平滑系数
                    this.currentY += this.velocity;
                    
                    // 限制边界（带阻尼）
                    if (this.currentY > 0) {
                        this.currentY *= 0.7; // 顶部阻尼
                        this.targetY = this.currentY;
                    } else if (this.currentY < -this.maxScroll) {
                        const overshoot = this.currentY + this.maxScroll;
                        this.currentY = -this.maxScroll + overshoot * 0.7; // 底部阻尼
                        this.targetY = this.currentY;
                    }
                }
                
                // 更新位置
                this.updateTransform();
                this.updateProgress();
                
                // 继续动画循环
                this.animationId = requestAnimationFrame((ts) => this.animate(ts));
            }
            
            updateTransform() {
                // 应用当前滚动位置
                this.inner.style.transform = `translateY(${this.currentY}px)`;
            }
            
            updateProgress() {
                // 计算当前进度（基于单张图片）
                const progressInSingleImage = (-this.currentY % this.imgHeight) / this.maxScroll;
                let percent = Math.min(100, Math.max(0, progressInSingleImage * 100));
                
                // 处理边界情况
                if (this.maxScroll <= 0) percent = 0;
                
                this.progress.style.width = `${percent}%`;
                this.progressText.textContent = `${Math.round(percent)}%`;
            }
            
            // ===== 事件处理函数 =====
            handleTouchStart(e) {
                if (e.touches.length !== 1) return;
                
                this.isTouching = true;
                this.isPlaying = false; // 触摸时暂停自动滚动
                
                const touch = e.touches[0];
                this.startY = touch.clientY;
                this.startTranslateY = this.currentY;
                this.lastY = touch.clientY;
                this.lastTimestamp = e.timeStamp;
                this.velocity = 0;
                
                e.preventDefault();
            }
            
            handleTouchMove(e) {
                if (!this.isTouching || e.touches.length !== 1) return;
                
                const touch = e.touches[0];
                const deltaY = touch.clientY - this.lastY;
                const deltaTime = e.timeStamp - this.lastTimestamp;
                
                // 计算速度（用于惯性滚动）
                if (deltaTime > 0) {
                    this.velocity = deltaY / deltaTime;
                }
                
                // 更新位置
                this.lastY = touch.clientY;
                this.lastTimestamp = e.timeStamp;
                
                // 应用拖动（带阻尼）
                const newY = this.currentY + deltaY * this.options.dragDamping;
                
                // 边界限制（iOS阻尼效果）
                if (newY > 0) {
                    this.currentY = newY * 0.3; // 顶部强阻尼
                } else if (newY < -this.maxScroll) {
                    const overshoot = newY + this.maxScroll;
                    this.currentY = -this.maxScroll + overshoot * 0.3; // 底部强阻尼
                } else {
                    this.currentY = newY;
                }
                
                this.targetY = this.currentY; // 同步目标位置
                this.updateTransform();
                
                e.preventDefault();
            }
            
            handleTouchEnd(e) {
                if (!this.isTouching) return;
                
                this.isTouching = false;
                
                // 应用惯性滚动
                if (Math.abs(this.velocity) > 0.1) {
                    this.targetY = this.currentY + this.velocity * 100; // 惯性系数
                }
                
                // 限制边界
                this.targetY = Math.max(-this.maxScroll, Math.min(0, this.targetY));
                
                e.preventDefault();
            }
            
            handleMouseDown(e) {
                if (e.button !== 0) return; // 只响应左键
                
                this.isDragging = true;
                this.isPlaying = false; // 拖动时暂停自动滚动
                
                this.startY = e.clientY;
                this.startTranslateY = this.currentY;
                this.lastY = e.clientY;
                this.lastTimestamp = e.timeStamp;
                this.velocity = 0;
                
                // 绑定全局鼠标事件
                const mouseMove = this.handleMouseMove.bind(this);
                const mouseUp = this.handleMouseUp.bind(this);
                
                document.addEventListener('mousemove', mouseMove);
                document.addEventListener('mouseup', function upHandler(e) {
                    mouseUp(e);
                    document.removeEventListener('mousemove', mouseMove);
                    document.removeEventListener('mouseup', upHandler);
                });
                
                e.preventDefault();
            }
            
            handleMouseMove(e) {
                if (!this.isDragging) return;
                
                const deltaY = e.clientY - this.lastY;
                const deltaTime = e.timeStamp - this.lastTimestamp;
                
                if (deltaTime > 0) {
                    this.velocity = deltaY / deltaTime;
                }
                
                this.lastY = e.clientY;
                this.lastTimestamp = e.timeStamp;
                
                const newY = this.currentY + deltaY * this.options.dragDamping;
                
                // 边界限制（与触摸相同）
                if (newY > 0) {
                    this.currentY = newY * 0.3;
                } else if (newY < -this.maxScroll) {
                    const overshoot = newY + this.maxScroll;
                    this.currentY = -this.maxScroll + overshoot * 0.3;
                } else {
                    this.currentY = newY;
                }
                
                this.targetY = this.currentY;
                this.updateTransform();
            }
            
            handleMouseUp(e) {
                if (!this.isDragging) return;
                
                this.isDragging = false;
                
                if (Math.abs(this.velocity) > 0.1) {
                    this.targetY = this.currentY + this.velocity * 100;
                }
                
                this.targetY = Math.max(-this.maxScroll, Math.min(0, this.targetY));
            }
            
            handleWheel(e) {
                if (Math.abs(e.deltaY) < 1) return;
                
                this.isPlaying = false; // 滚轮操作时暂停
                
                const wheelDelta = e.deltaY * 0.5; // 滚轮灵敏度
                this.targetY += wheelDelta;
                this.targetY = Math.max(-this.maxScroll, Math.min(0, this.targetY));
                
                e.preventDefault();
            }
            
            handleClick(e) {
                // 检查是否点击在进度条上
                if (e.target.closest('.progress-bar')) return;
                
                this.clickCount++;
                
                if (this.clickCount === 1) {
                    this.clickTimer = setTimeout(() => {
                        // 单击：切换播放/暂停
                        this.isPlaying = !this.isPlaying;
                        this.clickCount = 0;
                    }, this.options.doubleClickDelay);
                } else if (this.clickCount === 2) {
                    // 双击：恢复自动滚动
                    clearTimeout(this.clickTimer);
                    this.isPlaying = true;
                    this.clickCount = 0;
                }
            }
            
            handleProgressClick(e) {
                const rect = e.currentTarget.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const percent = clickX / rect.width;
                
                this.targetY = -this.maxScroll * percent;
                this.targetY = Math.max(-this.maxScroll, Math.min(0, this.targetY));
                this.isPlaying = true; // 跳转后自动播放
            }
            
            handleResize() {
                // 重新计算尺寸
                this.containerHeight = this.wrapper.clientHeight;
                this.imgHeight = this.imgs[0].clientHeight;
                this.maxScroll = this.imgHeight - this.containerHeight;
                this.scrollSpeed = this.maxScroll / this.options.totalSeconds;
                
                // 限制当前位置在有效范围内
                this.currentY = Math.max(-this.maxScroll, Math.min(0, this.currentY));
                this.targetY = Math.max(-this.maxScroll, Math.min(0, this.targetY));
                
                this.updateTransform();
            }
            
            // 公共方法
            play() { this.isPlaying = true; }
            pause() { this.isPlaying = false; }
            toggle() { this.isPlaying = !this.isPlaying; }
            
            destroy() {
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                }
            }
        }
        
        // ===== 原有的页面交互功能 =====
        document.querySelector('.year-3d').addEventListener('mousemove', function(e) {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            
            this.style.transform = `rotateX(${15 + yAxis}deg) rotateY(${xAxis}deg)`;
        });
        
        document.querySelector('.year-3d').addEventListener('click', function() {
            this.style.animation = 'none';
            this.style.transform = 'rotateX(20deg) rotateY(20deg) scale(1.1)';
            
            setTimeout(() => {
                this.style.animation = 'float 6s ease-in-out infinite';
            }, 500);
        });
        
        // 初始化页面加载动画
        document.addEventListener('DOMContentLoaded', function() {
            // 数字逐个出现效果
            const digits = document.querySelectorAll('.year-3d span');
            digits.forEach((digit, index) => {
                digit.style.opacity = '0';
                digit.style.transform = 'translateY(50px)';
                
                setTimeout(() => {
                    digit.style.transition = 'opacity 0.8s ease, transform 0.8s ease';
                    digit.style.opacity = '1';
                    digit.style.transform = 'translateY(0)';
                }, index * 200);
            });
            
            // logo图片加载动画
            const logoImg = document.querySelector('.logo img');
            if (logoImg) {
                logoImg.style.opacity = '0';
                logoImg.style.transform = 'translateY(30px)';
                
                setTimeout(() => {
                    logoImg.style.transition = 'opacity 1s ease, transform 1s ease';
                    logoImg.style.opacity = '1';
                    logoImg.style.transform = 'translateY(0)';
                }, 1000);
            }
            
            // 背景图片加载动画
            const bgImg = document.querySelector('.background img');
            if (bgImg) {
                bgImg.style.opacity = '0';
                bgImg.style.transition = 'opacity 1s ease';
                
                setTimeout(() => {
                    bgImg.style.opacity = '1';
                }, 500);
            }
            
            // 初始化teleprompter滚动效果（延迟启动，等待页面动画）
            setTimeout(() => {
                const teleprompterWrapper = document.querySelector('.teleprompter-wrapper');
                if (teleprompterWrapper) {
                    // ===== 在此修改滚动参数 =====
                    const teleprompter = new TeleprompterScroller(teleprompterWrapper, {
                        totalSeconds: 60,      // 修改这里调整滚动速度（秒）
                        dragDamping: 0.15,     // 拖动阻尼系数
                        doubleClickDelay: 300, // 双击识别间隔
                        autoPlay: true         // 自动开始滚动
                    });
                    // ===== 参数修改结束 =====
                    
                    // 保存实例以便调试
                    window.teleprompter = teleprompter;
                }
            }, 2000); // 延迟2秒开始滚动，等待页面动画完成
            
            // 初始化媒体播放器
            updateProgress();
        });
    </script>
