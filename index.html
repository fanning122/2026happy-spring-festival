<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMG Happy Spring Festival</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            flex-direction: column; /* 改为垂直排列 */
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: 'Arial Black', 'Arial', sans-serif;
            overflow: auto; /* 改为auto以允许滚动 */
            padding: 20px;
            position: relative; /* 为absolute定位的背景容器提供参考 */
        }
        
        .container {
            perspective: 1000px;
            text-align: center;
            margin-bottom: 0px; /* 增加与logo的间距 */
        }
        
        .year-3d {
            display: inline-block;
            font-size: 180px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 
                5px 5px 0 rgba(0, 0, 0, 0.3),
                10px 10px 20px rgba(0, 0, 0, 0.5);
            transform-style: preserve-3d;
            animation: float 6s ease-in-out infinite;
            letter-spacing: 15px;
        }
        
        .year-3d span {
            display: inline-block;
            position: relative;
            text-transform: uppercase;
            transform-style: preserve-3d;
        }
        
        /* 3D立体效果 */
        .year-3d span::before,
        .year-3d span::after {
            content: attr(data-digit);
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
        }
        
        .year-3d span::before {
            color: rgba(255, 215, 0, 0.5);
            transform: translateZ(-30px);
            z-index: -1;
        }
        
        .year-3d span::after {
            color: rgba(255, 140, 0, 0.7);
            transform: translateZ(-15px);
            z-index: -2;
        }
        
        /* 霓虹边框效果 */
        .neon-border {
            position: relative;
            padding: 20px;
            border-radius: 20px;
        }
        
        /* 金属质感增强 */
        .metal-effect {
            background: linear-gradient(
                135deg,
                #ffd700 0%,
                #ffec8b 25%,
                #ffd700 50%,
                #daa520 75%,
                #b8860b 100%
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            background-size: 200% auto;
            animation: shine 3s linear infinite;
        }
        
        /* 悬浮动画 */
        @keyframes float {
            0%, 100% {
                transform: rotateX(15deg) rotateY(0deg) translateY(0);
            }
            50% {
                transform: rotateX(15deg) rotateY(10deg) translateY(-20px);
            }
        }
        
        /* 金属光泽动画 */
        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }
        
        /* 响应式调整 */
        @media (max-width: 768px) {
            .year-3d {
                font-size: 120px;
                letter-spacing: 3px;
            }
        }
        
        @media (max-width: 480px) {
            .year-3d {
                font-size: 80px;
                letter-spacing: 0px;
            }
        }
        
        /* 闪烁效果 */
        .glow {
            animation: pulse 4s ease-in-out infinite;
            z-index: -1;
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 0.3;
            }
            50% {
                opacity: 0.7;
            }
        }
        
        .subtitle {
            margin-top: 80px;
            color: red;
            font-size: 50px;
            opacity: 0.88;
            /* 新增：为动画添加定位和变换原点 */
            position: relative;
            transform-origin: center top; /* 从顶部中心点缩放，避免影响下方元素 */
            z-index: 1;
            /* 初始动画：从下方进入（等待logo动画一半后开始） */
            animation: 
                subtitleEnter 2s ease-out 1.5s both, /* 出场动画：2秒时长，延迟1.5秒开始 */
                subtitleLoop 5s ease-in-out 3.5s infinite; /* 循环动画：延迟3.5秒开始（1.5s + 2s） */
        }
        
        /* Logo容器样式 - 添加在现有CSS之后，不修改现有部分 */
        .logo {
            text-align: center;
            margin-top: 0px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .logo img {
            max-width: 580px;
            width: 100%;
            height: auto;
            border-radius: 0px;
            transition: transform 0.3s ease;
        }
        
        .logo img:hover {
            transform: scale(1.02);
        }
        
        /* 手机端调整 */
        @media (max-width: 768px) {
            .logo img {
                max-width: 450px;
            }
        }
        
        @media (max-width: 480px) {
            .logo img {
                max-width: 380px;
            }
            .subtitle {
                font-size: 29px;
            }
        }
        
        /* ===== 新增的Background容器样式 ===== */
        /* 在现有CSS之后添加，不修改现有部分 */
        .background {
            position: absolute;
            top: 50%; /* 垂直居中 */
            left: 50%; /* 水平居中 */
            transform: translate(-50%, -50%); /* 精确居中 */
            z-index: -1; /* 确保在最底层 */
            width: 100%;
            text-align: center;
            pointer-events: none; /* 防止干扰上层交互 */
        }
        
        .background img {
            max-width: 680px;
            width: 90%; /* 相对宽度，适应不同屏幕 */
            height: auto;
            /* 移除透明度和模糊效果，保持清晰 */
            opacity: 1;
            filter: none;
        }
        
        /* 背景位置调整 - 可以通过修改这里的值上下移动背景 */
        /* 当前设置为居中，可以改为 top: 45%; 或 top: 55%; 来调整 */
        .background {
            top: 45%; /* 默认居中，可调整为 45%, 55% 等 */
        }
        
        /* 响应式调整 */
        @media (max-width: 768px) {
            .background img {
                max-width: 450px;
                opacity: 1; /* 保持完全不透明 */
            }
        }
        
        @media (max-width: 480px) {
            .background img {
                max-width: 350px;
                opacity: 1; /* 保持完全不透明 */
            }
        }
        
        /* ===== 新增：Subtitle动画关键帧 ===== */
        /* Subtitle进入动画 - 从下方滑入 */
        @keyframes subtitleEnter {
            0% {
                transform: translateY(100px) scale(1); /* 从下方100px开始 */
                opacity: 0;
            }
            100% {
                transform: translateY(0) scale(1); /* 到达最终位置 */
                opacity: 0.88;
            }
        }
        
        /* Subtitle循环动画 - 缩放和淡入淡出 */
        /* 修改关键：在80%到100%之间添加opacity的渐变过程 */
        @keyframes subtitleLoop {
            /* 阶段1: 50px → 150px 放大 (0-3秒) - 60% */
            0% {
                transform: scale(1); /* 1倍 = 50px */
                opacity: 0.88;
            }
            60% {
                transform: scale(3); /* 3倍 = 150px (50px * 3) */
                opacity: 0.88;
            }
            
            /* 阶段2: 150px → 160px + 淡出 (3-4秒) - 60%到80% */
            60%, 79.999% {
                transform: scale(3.2); /* 3.2倍 = 160px (50px * 3.2) */
                opacity: 0; /* 完全淡出 */
            }
            
            /* 关键修改点：在80%处scale值直接从3.2跳变到1，opacity开始淡入 */
            80% {
                transform: scale(1); /* 直接跳变回1倍 = 50px */
                opacity: 0; /* 开始淡入（完全透明） */
            }
            
            /* 新增：在90%处设置中间透明度，确保渐变可见 */
            90% {
                transform: scale(1); /* 保持50px大小 */
                opacity: 0.44; /* 中间透明度（0.88的一半） */
            }
            
            /* 阶段3: 保持50px大小并完成淡入 (4-5秒) - 80%到100% */
            100% {
                transform: scale(1); /* 保持50px大小 */
                opacity: 0.88; /* 淡入完成 */
            }
        }
        
        /* 响应式调整subtitle动画（移动端） */
        @media (max-width: 480px) {
            @keyframes subtitleLoop {
                0% {
                    transform: scale(1); /* 1倍 = 29px */
                    opacity: 0.88;
                }
                60% {
                    transform: scale(5.17); /* 150px / 29px ≈ 5.17倍 */
                    opacity: 0.88;
                }
                
                60%, 79.999% {
                    transform: scale(5.52); /* 160px / 29px ≈ 5.52倍 */
                    opacity: 0;
                }
                
                80% {
                    transform: scale(1); /* 直接跳变回1倍 = 29px */
                    opacity: 0;
                }
                
                90% {
                    transform: scale(1);
                    opacity: 0.44;
                }
                
                100% {
                    transform: scale(1);
                    opacity: 0.88;
                }
            }
        }
    </style>
</head>
<body>
    <!-- 新增的Background容器 - z轴最底层 -->
    <div class="background">
        <img src="background001.png" alt="背景图案">
    </div>
    
    <!-- 现有的Container容器 -->
    <div class="container">
        <div class="neon-border">
            <div class="glow"></div>
            <div class="year-3d">
                <span class="metal-effect" data-digit="2">2</span>
                <span class="metal-effect" data-digit="0">0</span>
                <span class="metal-effect" data-digit="2">2</span>
                <span class="metal-effect" data-digit="6">6</span>
            </div>
        </div>
        <div class="subtitle">Happy Spring Festival</div>
    </div>

    <!-- 现有的Logo容器 -->
    <div class="logo">
        <img src="MyCardEnglish.png" alt="CMG Logo">
    </div>

    <script>
        // 添加鼠标互动效果
        document.querySelector('.year-3d').addEventListener('mousemove', function(e) {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            
            this.style.transform = `rotateX(${15 + yAxis}deg) rotateY(${xAxis}deg)`;
        });
        
        // 添加点击效果
        document.querySelector('.year-3d').addEventListener('click', function() {
            this.style.animation = 'none';
            this.style.transform = 'rotateX(20deg) rotateY(20deg) scale(1.1)';
            
            setTimeout(() => {
                this.style.animation = 'float 6s ease-in-out infinite';
            }, 500);
        });
        
        // 让数字逐个出现
        document.addEventListener('DOMContentLoaded', function() {
            const digits = document.querySelectorAll('.year-3d span');
            digits.forEach((digit, index) => {
                digit.style.opacity = '0';
                digit.style.transform = 'translateY(50px)';
                
                setTimeout(() => {
                    digit.style.transition = 'opacity 0.8s ease, transform 0.8s ease';
                    digit.style.opacity = '1';
                    digit.style.transform = 'translateY(0)';
                }, index * 200);
            });
            
            // 添加logo图片加载动画
            const logoImg = document.querySelector('.logo img');
            if (logoImg) {
                logoImg.style.opacity = '0';
                logoImg.style.transform = 'translateY(30px)';
                
                setTimeout(() => {
                    logoImg.style.transition = 'opacity 1s ease, transform 1s ease';
                    logoImg.style.opacity = '1';
                    logoImg.style.transform = 'translateY(0)';
                }, 1000); // logo动画延迟1秒开始
            }
            
            // 添加背景图片加载动画 - 保持不透明
            const bgImg = document.querySelector('.background img');
            if (bgImg) {
                bgImg.style.opacity = '0';
                bgImg.style.transition = 'opacity 1s ease';
                
                setTimeout(() => {
                    bgImg.style.opacity = '1'; /* 完全不透明 */
                }, 500);
            }
        });
    </script>
</body>
</html>
