<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMG Happy Spring Festival</title>
    <style>
        /* 原有的所有CSS保持不变... */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: 'Arial Black', 'Arial', sans-serif;
            overflow: auto;
            padding: 20px;
            position: relative;
            padding-top: 0;
        }
        
        /* ===== 关键修复：添加这3行 ===== */
        /* 防止body被撑高 */
        body {
            overflow-x: hidden; /* 添加这一行 */
        }
        
        /* 防止html文档被撑高 */
        html {
            overflow-y: auto; /* 允许垂直滚动 */
            overflow-x: hidden; /* 隐藏水平滚动 */
        }
        
        /* 媒体播放器控制栏样式 */
        .media-player {
            position: fixed;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 580px;
            height: 50px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }
        
        .control-btn {
            background: linear-gradient(135deg, #ffd700, #daa520);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }
        
        .control-btn:hover {
            transform: scale(1.1);
            background: linear-gradient(135deg, #ffec8b, #ffd700);
        }
        
        .control-btn.active {
            background: linear-gradient(135deg, #ff4500, #ff6347);
            color: white;
        }
        
        .progress-container {
            flex: 1;
            margin: 0 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .time-display {
            display: flex;
            justify-content: space-between;
            width: 100%;
            color: #ffd700;
            font-size: 12px;
            margin-bottom: 5px;
            font-family: monospace;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 215, 0, 0.3);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .progress {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ff4500);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
        }
        
        .progress-bar:hover .progress {
            background: linear-gradient(90deg, #ffec8b, #ff6347);
        }
        
        .hidden-media {
            display: none;
            position: absolute;
            top: -9999px;
            left: -9999px;
        }
        
        @media (max-width: 768px) {
            .media-player {
                width: 90%;
                max-width: 580px;
            }
        }
        
        @media (max-width: 480px) {
            .media-player {
                width: 95%;
                height: 45px;
                padding: 0 10px;
            }
            
            .control-btn {
                width: 35px;
                height: 35px;
                font-size: 16px;
            }
            
            .time-display {
                font-size: 10px;
            }
        }
        
        .container {
            perspective: 1000px;
            text-align: center;
            margin-bottom: 0px;
        }
        
        .year-3d {
            display: inline-block;
            font-size: 180px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 
                5px 5px 0 rgba(0, 0, 0, 0.3),
                10px 10px 20px rgba(0, 0, 0, 0.5);
            transform-style: preserve-3d;
            animation: float 6s ease-in-out infinite;
            letter-spacing: 15px;
        }
        
        .year-3d span {
            display: inline-block;
            position: relative;
            text-transform: uppercase;
            transform-style: preserve-3d;
        }
        
        .year-3d span::before,
        .year-3d span::after {
            content: attr(data-digit);
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
        }
        
        .year-3d span::before {
            color: rgba(255, 215, 0, 0.5);
            transform: translateZ(-30px);
            z-index: -1;
        }
        
        .year-3d span::after {
            color: rgba(255, 140, 0, 0.7);
            transform: translateZ(-15px);
            z-index: -2;
        }
        
        .neon-border {
            position: relative;
            padding: 20px;
            border-radius: 20px;
        }
        
        .metal-effect {
            background: linear-gradient(
                135deg,
                #ffd700 0%,
                #ffec8b 25%,
                #ffd700 50%,
                #daa520 75%,
                #b8860b 100%
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            background-size: 200% auto;
            animation: shine 3s linear infinite;
        }
        
        @keyframes float {
            0%, 100% {
                transform: rotateX(15deg) rotateY(0deg) translateY(0);
            }
            50% {
                transform: rotateX(15deg) rotateY(10deg) translateY(-20px);
            }
        }
        
        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }
        
        @media (max-width: 768px) {
            .year-3d {
                font-size: 120px;
                letter-spacing: 3px;
            }
        }
        
        @media (max-width: 480px) {
            .year-3d {
                font-size: 80px;
                letter-spacing: 0px;
            }
        }
        
        .glow {
            animation: pulse 4s ease-in-out infinite;
            z-index: -1;
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 0.3;
            }
            50% {
                opacity: 0.7;
            }
        }
        
        .logo {
            text-align: center;
            margin-top: -24px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .logo img {
            max-width: 580px;
            width: 100%;
            height: auto;
            border-radius: 0px;
            transition: transform 0.3s ease;
        }
        
        .logo img:hover {
            transform: scale(1.02);
        }
        
        @media (max-width: 768px) {
            .logo img {
                max-width: 450px;
            }
        }
        
        @media (max-width: 480px) {
            .logo img {
                max-width: 380px;
            }
        }
        
        .background {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            width: 100%;
            text-align: center;
            pointer-events: none;
        }
        
        .background img {
            max-width: 680px;
            width: 90%;
            height: auto;
            opacity: 1;
            filter: none;
        }
        
        .background {
            top: 380px;
        }
        
        @media (max-width: 768px) {
            .background {margin-top: auto;}
            .background img {
                max-width: 450px;
                opacity: 1;
            }
        }
        
        @media (max-width: 480px) {
            .background {top: 160px;}
            .logo {
                margin-top: -90px;
            }
            .background img {
                max-width: 350px;
                opacity: 1;
            }
        }
        
        .main-subtitle {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 100px;
        }
        
        .subtitle {
            color: red;
            font-size: 50px;
            opacity: 0.88;
            position: relative;
            transform-origin: center top;
            z-index: 1;
            animation: 
                subtitleEnter 2s ease-out 1.5s both,
                subtitleLoop 5s ease-in-out 3.5s infinite;
        }
        
        @keyframes subtitleEnter {
            0% {
                transform: translateY(100px) scale(1);
                opacity: 0;
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 0.88;
            }
        }
        
        @keyframes subtitleLoop {
            0% {
                transform: scale(1);
                opacity: 0.88;
            }
            60% {
                transform: scale(3);
                opacity: 0.88;
            }
            60%, 79.999% {
                transform: scale(3.2);
                opacity: 0;
            }
            80% {
                transform: scale(1);
                opacity: 0;
            }
            90% {
                transform: scale(1);
                opacity: 0.44;
            }
            100% {
                transform: scale(1);
                opacity: 0.88;
            }
        }
        
        @media (max-width: 480px) {
            .subtitle {
                top: -70px;
                font-size: 29px;
            }
        }
        
        .main-content {
            position: absolute;
            top: -2vh;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
        }
        
        @media (max-width: 768px) {
            .main-content {
                top: 30vh;
            }
        }
        
        @media (max-width: 480px) {
            .main-content {
                top: 2vh;
            }
        }
        
        /* ===== 关键修复：image-window容器 ===== */
        .image-window {
            margin-top: -80px;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden; /* 保持hidden */
            background: transparent;
            gap: 0;
            position: relative;
            z-index: -2;
            /* 关键：添加这3行，防止影响页面 */
            height: 500px; /* 固定高度 */
            contain: strict; /* 隔离内容 */
            isolation: isolate; /* 创建新的堆叠上下文 */
        }
        
        /* 原始图片（仅用于加载动画） */
        .image-window .original-img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            opacity: 0;
            position: absolute;
            z-index: -1;
        }
        
        /* ===== 关键修复：TELEPROMPTER样式 ===== */
        .teleprompter-wrapper {
            position: relative;
            width: 430px;
            height: 500px;
            overflow-y: auto; /* 允许垂直滚动 */
            overflow-x: hidden;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            background: #000;
            cursor: pointer;
            margin: 0 auto;
            opacity: 0;
            transition: opacity 0.5s ease;
            -webkit-overflow-scrolling: touch; /* iOS平滑滚动 */
            /* 关键：添加这3行，隔离滚动 */
            contain: strict; /* 强烈隔离 */
            will-change: transform; /* 优化性能 */
            transform: translateZ(0); /* 创建新的图层 */
        }
        
        .teleprompter-wrapper.loaded {
            opacity: 1;
        }
        
        /* 关键修复：图片样式 - 保持原始尺寸但隔离影响 */
        .teleprompter-wrapper img {
            width: 100%;
            height: auto; /* 保持原始比例 */
            display: block;
            pointer-events: none;
            user-select: none;
            /* 关键：添加这2行，防止影响文档流 */
            contain: content; /* 隔离图片内容 */
            backface-visibility: hidden; /* 优化性能 */
        }
        
        /* 进度条容器 */
        .teleprompter-progress {
            position: sticky;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, rgba(15, 32, 39, 0.9), transparent);
            padding: 10px 15px;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .teleprompter-wrapper:hover .teleprompter-progress {
            opacity: 1;
        }
        
        .teleprompter-progress .time-display {
            margin-bottom: 0;
            justify-content: center;
        }
        
        .teleprompter-progress .progress-bar {
            margin-top: 5px;
            height: 4px;
            background: rgba(255, 215, 0, 0.3);
            border-radius: 2px;
        }
        
        .teleprompter-progress .progress {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ff4500);
            border-radius: 2px;
            width: 0%;
        }
        
        /* 响应式调整 */
        @media (max-width: 768px) {
            .image-window {
                max-width: 100vw;
                margin-left: calc(-50vw + 50%);
            }
        }
        
        @media (max-width: 480px) {
            .image-window {
                margin-top: -60px;
                width: 100vw;
                margin-left: calc(-50vw + 50%);
                height: 500px; /* 移动端调整高度 */
            }
            
            .teleprompter-wrapper {
                width: 90vw;
                max-width: 430px;
                height: 500px; /* 移动端调整高度 */
            }
        }
        
        /* 桌面端图片最大宽度限制 */
        @media (min-width: 769px) {
            .image-window img {
                max-width: 580px;
            }
            
            .teleprompter-wrapper {
                max-width: 430px;
            }
        }
    </style>
</head>
<body>
    <!-- 媒体播放器控制栏 -->
    <div class="media-player">
        <button class="control-btn" id="playPauseBtn">▶</button>
        
        <div class="progress-container">
            <div class="time-display">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>
            <div class="progress-bar" id="progressBar">
                <div class="progress" id="progress"></div>
            </div>
        </div>
        
        <button class="control-btn" id="loopBtn">🔁</button>
    </div>
    
    <!-- 隐藏的媒体元素 -->
    <div class="hidden-media">
        <audio id="mediaPlayer" controls>
            <source src="congratulationprosperous.mp4" type="audio/mpeg">
            <source src="media/audio.ogg" type="audio/ogg">
            您的浏览器不支持音频播放
        </audio>
    </div>

    <!-- 主内容包装器 -->
    <div class="main-content">
        <!-- Background容器 -->
        <div class="background">
            <img src="background001.png" alt="背景图案">
        </div>
        
        <!-- Container容器 -->
        <div class="container">
            <div class="neon-border">
                <div class="glow"></div>
                <div class="year-3d">
                    <span class="metal-effect" data-digit="2">2</span>
                    <span class="metal-effect" data-digit="0">0</span>
                    <span class="metal-effect" data-digit="2">2</span>
                    <span class="metal-effect" data-digit="6">6</span>
                </div>
            </div>
        </div>

        <!-- Main Subtitle容器 -->
        <div class="main-subtitle">
            <div class="subtitle">Happy Spring Festival</div>
        </div>

        <!-- Logo容器 -->
        <div class="logo">
            <img src="MyCardEnglish.png" alt="CMG Logo">
        </div>
        
        <!-- 图片窗口容器 -->
        <div class="image-window">
            <!-- 原始图片（仅用于加载动画） -->
            <img src="Socialmap003.jpg" alt="展示图片1" class="original-img">
            
            <!-- Teleprompter滚动容器 -->
            <div class="teleprompter-wrapper loading">
                <!-- 单张图片 -->
                <img src="Socialmap003.jpg" alt="展示图片1" class="teleprompter-img">
                
                <!-- 进度条 -->
                <div class="teleprompter-progress">
                    <div class="time-display">
                        <span class="progress-text">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== 媒体播放器功能 =====
        const mediaPlayer = document.getElementById('mediaPlayer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const loopBtn = document.getElementById('loopBtn');
        const progressBar = document.getElementById('progressBar');
        const progress = document.getElementById('progress');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        
        let isPlaying = false;
        let isLooping = false;
        
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }
        
        function updateProgress() {
            if (!mediaPlayer.duration) return;
            
            const percent = (mediaPlayer.currentTime / mediaPlayer.duration) * 100;
            progress.style.width = `${percent}%`;
            
            currentTimeEl.textContent = formatTime(mediaPlayer.currentTime);
            durationEl.textContent = formatTime(mediaPlayer.duration);
        }
        
        function setProgress(e) {
            const width = progressBar.clientWidth;
            const clickX = e.offsetX;
            const duration = mediaPlayer.duration;
            
            mediaPlayer.currentTime = (clickX / width) * duration;
        }
        
        function togglePlayPause() {
            if (isPlaying) {
                mediaPlayer.pause();
                playPauseBtn.textContent = '▶';
            } else {
                mediaPlayer.play().catch(e => {
                    console.log('播放被阻止:', e);
                });
                playPauseBtn.textContent = '⏸';
            }
            isPlaying = !isPlaying;
        }
        
        function toggleLoop() {
            isLooping = !isLooping;
            mediaPlayer.loop = isLooping;
            loopBtn.classList.toggle('active', isLooping);
        }
        
        mediaPlayer.addEventListener('timeupdate', updateProgress);
        mediaPlayer.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(mediaPlayer.duration);
            updateProgress();
        });
        mediaPlayer.addEventListener('ended', () => {
            if (!isLooping) {
                isPlaying = false;
                playPauseBtn.textContent = '▶';
            }
        });
        
        playPauseBtn.addEventListener('click', togglePlayPause);
        loopBtn.addEventListener('click', toggleLoop);
        progressBar.addEventListener('click', setProgress);
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlayPause();
            }
        });
        
        // ===== 简化的单张图片滚动控制器 =====
        class SimpleImageScroller {
            constructor(wrapper, options = {}) {
                this.wrapper = wrapper;
                this.img = wrapper.querySelector('img');
                this.progressBar = wrapper.querySelector('.progress-bar');
                this.progress = wrapper.querySelector('.progress');
                this.progressText = wrapper.querySelector('.progress-text');
                
                // 可调节参数
                this.options = {
                    scrollSpeed: 1.5,
                    autoPlay: false,
                    ...options
                };
                
                // 滚动状态
                this.isPlaying = this.options.autoPlay;
                this.hasStarted = false;
                this.isUserScrolling = false;
                this.scrollAnimationId = null;
                
                // 初始化
                this.init();
            }
            
            async init() {
                console.log('SimpleImageScroller初始化开始');
                
                // 等待图片加载
                await this.waitForImageLoad();
                
                // 显示容器
                this.wrapper.classList.remove('loading');
                this.wrapper.classList.add('loaded');
                
                // 绑定事件
                this.bindEvents();
                
                console.log('SimpleImageScroller初始化完成');
            }
            
            waitForImageLoad() {
                return new Promise((resolve) => {
                    if (this.img.complete && this.img.naturalHeight > 100) {
                        console.log('图片加载完成，尺寸:', 
                            `${this.img.naturalWidth}×${this.img.naturalHeight}px`);
                        setTimeout(resolve, 100);
                    } else {
                        this.img.onload = () => {
                            console.log('图片onload触发，尺寸:', 
                                `${this.img.naturalWidth}×${this.img.naturalHeight}px`);
                            setTimeout(resolve, 100);
                        };
                        this.img.onerror = () => setTimeout(resolve, 100);
                    }
                    
                    setTimeout(resolve, 5000);
                });
            }
            
            bindEvents() {
                // 点击切换播放/暂停
                this.wrapper.addEventListener('click', (e) => {
                    if (e.target.closest('.progress-bar')) return;
                    
                    if (this.isUserScrolling) {
                        this.isUserScrolling = false;
                        this.togglePlay();
                    } else {
                        this.togglePlay();
                    }
                });
                
                // 进度条点击跳转
                this.progressBar.addEventListener('click', (e) => {
                    const rect = e.currentTarget.getBoundingClientRect();
                    const clickX = e.clientX - rect.left;
                    const percent = clickX / rect.width;
                    
                    this.jumpToPercent(percent);
                    
                    this.isPlaying = true;
                    this.animateScroll();
                });
                
                // 监听用户手动滚动
                let scrollTimeout;
                this.wrapper.addEventListener('scroll', () => {
                    this.updateProgressFromScroll();
                    
                    if (scrollTimeout) clearTimeout(scrollTimeout);
                    
                    if (this.isPlaying && !this.isUserScrolling) {
                        this.isUserScrolling = true;
                        this.pause();
                    }
                    
                    scrollTimeout = setTimeout(() => {
                        console.log('滚动停止');
                    }, 100);
                });
                
                // 监听触摸开始
                this.wrapper.addEventListener('touchstart', (e) => {
                    if (this.isPlaying && !this.isUserScrolling) {
                        this.isUserScrolling = true;
                        this.pause();
                    }
                });
            }
            
            updateProgressFromScroll() {
                const scrollTop = this.wrapper.scrollTop;
                const scrollHeight = this.wrapper.scrollHeight;
                const clientHeight = this.wrapper.clientHeight;
                const maxScroll = scrollHeight - clientHeight;
                
                if (maxScroll <= 0) return;
                
                const percent = (scrollTop / maxScroll) * 100;
                const roundedPercent = Math.round(percent);
                
                this.progress.style.width = percent + '%';
                this.progressText.textContent = roundedPercent + '%';
                
                // 如果滚动到底部，自动停止
                if (scrollTop >= maxScroll - 5) {
                    if (this.isPlaying) {
                        this.isPlaying = false;
                        cancelAnimationFrame(this.scrollAnimationId);
                    }
                }
            }
            
            jumpToPercent(percent) {
                const scrollHeight = this.wrapper.scrollHeight;
                const clientHeight = this.wrapper.clientHeight;
                const maxScroll = scrollHeight - clientHeight;
                
                if (maxScroll <= 0) return;
                
                const targetScroll = (percent * maxScroll) / 100;
                this.wrapper.scrollTop = targetScroll;
                
                this.progress.style.width = (percent * 100) + '%';
                this.progressText.textContent = Math.round(percent * 100) + '%';
            }
            
            animateScroll() {
                if (this.isPlaying) {
                    let scrollTop = this.wrapper.scrollTop;
                    const scrollHeight = this.wrapper.scrollHeight;
                    const clientHeight = this.wrapper.clientHeight;
                    const maxScroll = scrollHeight - clientHeight;
                    
                    if (scrollTop < maxScroll) {
                        scrollTop += this.options.scrollSpeed;
                        scrollTop = Math.min(scrollTop, maxScroll);
                        
                        this.wrapper.scrollTop = scrollTop;
                        this.updateProgressFromScroll();
                        
                        this.scrollAnimationId = requestAnimationFrame(() => this.animateScroll());
                    } else {
                        this.isPlaying = false;
                        cancelAnimationFrame(this.scrollAnimationId);
                    }
                }
            }
            
            togglePlay() {
                if (!this.hasStarted) {
                    this.hasStarted = true;
                    this.isPlaying = true;
                    this.animateScroll();
                } else {
                    this.isPlaying = !this.isPlaying;
                    
                    if (this.isPlaying) {
                        this.animateScroll();
                    } else {
                        cancelAnimationFrame(this.scrollAnimationId);
                    }
                }
            }
            
            play() { 
                if (!this.hasStarted) this.hasStarted = true;
                this.isPlaying = true; 
                this.animateScroll();
            }
            
            pause() { 
                this.isPlaying = false; 
                cancelAnimationFrame(this.scrollAnimationId);
            }
        }
        
        // ===== 原有的页面交互功能 =====
        document.querySelector('.year-3d').addEventListener('mousemove', function(e) {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            
            this.style.transform = `rotateX(${15 + yAxis}deg) rotateY(${xAxis}deg)`;
        });
        
        document.querySelector('.year-3d').addEventListener('click', function() {
            this.style.animation = 'none';
            this.style.transform = 'rotateX(20deg) rotateY(20deg) scale(1.1)';
            
            setTimeout(() => {
                this.style.animation = 'float 6s ease-in-out infinite';
            }, 500);
        });
        
        // ===== 页面高度监控 =====
        function checkPageHeight() {
            const bodyHeight = document.body.scrollHeight;
            const windowHeight = window.innerHeight;
            const hasScrollbar = bodyHeight > windowHeight + 10; // 10px容差
            
            console.log('📏 页面高度检查:', {
                'body高度': `${bodyHeight}px`,
                '窗口高度': `${windowHeight}px`,
                '是否有全局滚动条': hasScrollbar ? '是 ❌' : '否 ✅',
                '差值': `${bodyHeight - windowHeight}px`
            });
            
            return !hasScrollbar;
        }
        
        // ===== 初始化页面 =====
        document.addEventListener('DOMContentLoaded', function() {
            console.log('页面加载完成，开始初始化...');
            
            // 数字逐个出现效果
            const digits = document.querySelectorAll('.year-3d span');
            digits.forEach((digit, index) => {
                digit.style.opacity = '0';
                digit.style.transform = 'translateY(50px)';
                
                setTimeout(() => {
                    digit.style.transition = 'opacity 0.8s ease, transform 0.8s ease';
                    digit.style.opacity = '1';
                    digit.style.transform = 'translateY(0)';
                }, index * 200);
            });
            
            // logo图片加载动画
            const logoImg = document.querySelector('.logo img');
            if (logoImg) {
                logoImg.style.opacity = '0';
                logoImg.style.transform = 'translateY(30px)';
                
                setTimeout(() => {
                    logoImg.style.transition = 'opacity 1s ease, transform 1s ease';
                    logoImg.style.opacity = '1';
                    logoImg.style.transform = 'translateY(0)';
                }, 1000);
            }
            
            // 延迟初始化图片滚动器
            setTimeout(() => {
                console.log('初始化SimpleImageScroller...');
                const teleprompterWrapper = document.querySelector('.teleprompter-wrapper');
                
                if (teleprompterWrapper) {
                    const scroller = new SimpleImageScroller(teleprompterWrapper, {
                        scrollSpeed: 1.5,
                        autoPlay: false
                    });
                    
                    window.imageScroller = scroller;
                    
                    // 图片加载完成后检查页面高度
                    setTimeout(() => {
                        console.log('\n=== 页面高度检查 ===');
                        const heightOk = checkPageHeight();
                        if (heightOk) {
                            console.log('✅ 页面高度正常，无全局滚动条');
                        } else {
                            console.log('⚠️  页面高度异常，已通过CSS隔离修复');
                        }
                    }, 500);
                    
                } else {
                    console.error('找不到teleprompter-wrapper元素');
                }
            }, 2000);
            
            // 初始化媒体播放器
            updateProgress();
            
            // 暴露检查函数到全局
            window.checkPageHeight = checkPageHeight;
        });
    </script>
</body>
</html>
