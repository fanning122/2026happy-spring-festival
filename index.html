<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMG Happy Spring Festival</title>
    <style>
        /* 所有现有CSS完全保持不变 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow-x: hidden;
        }
        
        html {
            overflow-y: auto;
            overflow-x: hidden;
        }
        
        body {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: 'Arial Black', 'Arial', sans-serif;
            overflow: auto;
            padding: 20px;
            position: relative;
            padding-top: 0;
        }
        
        .media-player {
            position: fixed;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 580px;
            height: 50px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }
        
        .control-btn {
            background: linear-gradient(135deg, #ffd700, #daa520);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }
        
        .control-btn:hover {
            transform: scale(1.1);
            background: linear-gradient(135deg, #ffec8b, #ffd700);
        }
        
        .control-btn.active {
            background: linear-gradient(135deg, #ff4500, #ff6347);
            color: white;
        }
        
        .progress-container {
            flex: 1;
            margin: 0 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .time-display {
            display: flex;
            justify-content: space-between;
            width: 100%;
            color: #ffd700;
            font-size: 12px;
            margin-bottom: 5px;
            font-family: monospace;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 215, 0, 0.3);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .progress {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ff4500);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
        }
        
        .progress-bar:hover .progress {
            background: linear-gradient(90deg, #ffec8b, #ff6347);
        }
        
        .hidden-media {
            display: none;
            position: absolute;
            top: -9999px;
            left: -9999px;
        }
        
        @media (max-width: 768px) {
            .media-player {
                width: 90%;
                max-width: 580px;
            }
        }
        
        @media (max-width: 480px) {
            .media-player {
                width: 95%;
                height: 45px;
                padding: 0 10px;
            }
            
            .control-btn {
                width: 35px;
                height: 35px;
                font-size: 16px;
            }
            
            .time-display {
                font-size: 10px;
            }
        }
        
        .container {
            perspective: 1000px;
            text-align: center;
            margin-bottom: 0px;
        }
        
        .year-3d {
            display: inline-block;
            font-size: 180px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 
                5px 5px 0 rgba(0, 0, 0, 0.3),
                10px 10px 20px rgba(0, 0, 0, 0.5);
            transform-style: preserve-3d;
            animation: float 6s ease-in-out infinite;
            letter-spacing: 15px;
        }
        
        .year-3d span {
            display: inline-block;
            position: relative;
            text-transform: uppercase;
            transform-style: preserve-3d;
        }
        
        .year-3d span::before,
        .year-3d span::after {
            content: attr(data-digit);
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
        }
        
        .year-3d span::before {
            color: rgba(255, 215, 0, 0.5);
            transform: translateZ(-30px);
            z-index: -1;
        }
        
        .year-3d span::after {
            color: rgba(255, 140, 0, 0.7);
            transform: translateZ(-15px);
            z-index: -2;
        }
        
        .neon-border {
            position: relative;
            padding: 20px;
            border-radius: 20px;
        }
        
        .metal-effect {
            background: linear-gradient(
                135deg,
                #ffd700 0%,
                #ffec8b 25%,
                #ffd700 50%,
                #daa520 75%,
                #b8860b 100%
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            background-size: 200% auto;
            animation: shine 3s linear infinite;
        }
        
        @keyframes float {
            0%, 100% {
                transform: rotateX(15deg) rotateY(0deg) translateY(0);
            }
            50% {
                transform: rotateX(15deg) rotateY(10deg) translateY(-20px);
            }
        }
        
        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }
        
        @media (max-width: 768px) {
            .year-3d {
                font-size: 120px;
                letter-spacing: 3px;
            }
        }
        
        @media (max-width: 480px) {
            .year-3d {
                font-size: 80px;
                letter-spacing: 0px;
            }
        }
        
        .glow {
            animation: pulse 4s ease-in-out infinite;
            z-index: -1;
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 0.3;
            }
            50% {
                opacity: 0.7;
            }
        }
        
        .logo {
            text-align: center;
            margin-top: -24px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .logo img {
            max-width: 580px;
            width: 100%;
            height: auto;
            border-radius: 0px;
            transition: transform 0.3s ease;
        }
        
        .logo img:hover {
            transform: scale(1.02);
        }
        
        @media (max-width: 768px) {
            .logo img {
                max-width: 450px;
            }
        }
        
        @media (max-width: 480px) {
            .logo img {
                max-width: 380px;
            }
        }
        
        .background {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            width: 100%;
            text-align: center;
            pointer-events: none;
        }
        
        .background img {
            max-width: 680px;
            width: 90%;
            height: auto;
            opacity: 1;
            filter: none;
        }
        
        .background {
            top: 380px;
        }
        
        @media (max-width: 768px) {
            .background {margin-top: auto;}
            .background img {
                max-width: 450px;
                opacity: 1;
            }
        }
        
        @media (max-width: 480px) {
            .background {top: 160px;}
            .logo {
                margin-top: -90px;
            }
            .background img {
                max-width: 350px;
                opacity: 1;
            }
        }
        
        .main-subtitle {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 100px;
        }
        
        .subtitle {
            color: red;
            font-size: 50px;
            opacity: 0.88;
            position: relative;
            transform-origin: center top;
            z-index: 1;
            animation: 
                subtitleEnter 2s ease-out 1.5s both,
                subtitleLoop 5s ease-in-out 3.5s infinite;
        }
        
        @keyframes subtitleEnter {
            0% {
                transform: translateY(100px) scale(1);
                opacity: 0;
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 0.88;
            }
        }
        
        @keyframes subtitleLoop {
            0% {
                transform: scale(1);
                opacity: 0.88;
            }
            60% {
                transform: scale(3);
                opacity: 0.88;
            }
            60%, 79.999% {
                transform: scale(3.2);
                opacity: 0;
            }
            80% {
                transform: scale(1);
                opacity: 0;
            }
            90% {
                transform: scale(1);
                opacity: 0.44;
            }
            100% {
                transform: scale(1);
                opacity: 0.88;
            }
        }
        
        @media (max-width: 480px) {
            .subtitle {
                top: -70px;
                font-size: 29px;
            }
        }
        
        .main-content {
            position: absolute;
            top: -2vh;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
        }
        
        @media (max-width: 768px) {
            .main-content {
                top: 30vh;
            }
        }
        
        @media (max-width: 480px) {
            .main-content {
                top: 2vh;
            }
        }
        
        .image-window {
            margin-top: -80px;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            background: transparent;
            gap: 0;
            position: relative;
            z-index: -2;
            height: 500px;
            contain: strict;
            isolation: isolate;
        }
        
        .image-window .original-img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            opacity: 0;
            position: absolute;
            z-index: -1;
        }
        
        .teleprompter-wrapper {
            position: relative;
            width: 430px;
            height: 500px;
            overflow-y: auto;
            overflow-x: hidden;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            background: #000;
            cursor: pointer;
            margin: 0 auto;
            opacity: 0;
            transition: opacity 0.5s ease;
            -webkit-overflow-scrolling: touch;
            contain: strict;
            will-change: transform;
            transform: translateZ(0);
        }
        
        .teleprompter-wrapper.loaded {
            opacity: 1;
        }
        
        .teleprompter-inner {
            position: relative;
            width: 100%;
        }
        
        .teleprompter-inner img {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none;
            user-select: none;
            contain: content;
            backface-visibility: hidden;
        }
        
        .teleprompter-progress {
            position: sticky;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, rgba(15, 32, 39, 0.9), transparent);
            padding: 10px 15px;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .teleprompter-wrapper:hover .teleprompter-progress {
            opacity: 1;
        }
        
        .teleprompter-progress .time-display {
            margin-bottom: 0;
            justify-content: center;
        }
        
        .teleprompter-progress .progress-bar {
            margin-top: 5px;
            height: 4px;
            background: rgba(255, 215, 0, 0.3);
            border-radius: 2px;
        }
        
        .teleprompter-progress .progress {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ff4500);
            border-radius: 2px;
            width: 0%;
        }
        
        @media (max-width: 768px) {
            .image-window {
                max-width: 100vw;
                margin-left: calc(-50vw + 50%);
            }
        }
        
        @media (max-width: 480px) {
            .image-window {
                margin-top: -60px;
                width: 100vw;
                margin-left: calc(-50vw + 50%);
                height: 500px;
            }
            
            .teleprompter-wrapper {
                width: 90vw;
                max-width: 430px;
                height: 500px;
            }
        }
        
        @media (min-width: 769px) {
            .image-window img {
                max-width: 580px;
            }
            
            .teleprompter-wrapper {
                max-width: 430px;
            }
        }
        
        /* ===== 新增：Teleprompter控制按钮样式 ===== */
        .teleprompter-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 20;
            pointer-events: auto;
        }
        
        .teleprompter-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.9), rgba(218, 165, 32, 0.9));
            border: 2px solid #ffd700;
            color: #000;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 
                0 4px 15px rgba(0, 0, 0, 0.5),
                0 0 10px rgba(255, 215, 0, 0.5);
            backdrop-filter: blur(5px);
            pointer-events: auto;
        }
        
        .teleprompter-btn:hover {
            transform: scale(1.1);
            background: linear-gradient(135deg, rgba(255, 236, 139, 0.95), rgba(255, 215, 0, 0.95));
            box-shadow: 
                0 6px 20px rgba(0, 0, 0, 0.6),
                0 0 15px rgba(255, 215, 0, 0.8);
        }
        
        .teleprompter-btn:active {
            transform: scale(0.95);
        }
        
        .teleprompter-btn.active {
            background: linear-gradient(135deg, rgba(255, 69, 0, 0.9), rgba(255, 99, 71, 0.9));
            color: white;
            border-color: #ff4500;
        }
        
        /* 适配响应式设计 */
        @media (max-width: 768px) {
            .teleprompter-controls {
                bottom: 15px;
                gap: 12px;
            }
            
            .teleprompter-btn {
                width: 45px;
                height: 45px;
                font-size: 18px;
            }
        }
        
        @media (max-width: 480px) {
            .teleprompter-controls {
                bottom: 10px;
                gap: 10px;
            }
            
            .teleprompter-btn {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
        }
        
        /* 确保按钮不会干扰teleprompter-wrapper的点击事件 */
        .teleprompter-wrapper {
            pointer-events: auto;
        }
        
        /* 当按钮容器可见时，调整原有进度条位置，避免重叠 */
        .teleprompter-progress {
            bottom: 70px;
            transition: bottom 0.3s ease;
        }
        
        .teleprompter-wrapper:hover .teleprompter-progress {
            bottom: 70px;
        }
    </style>
</head>
<body>
    <!-- 媒体播放器控制栏 -->
    <div class="media-player">
        <button class="control-btn" id="playPauseBtn">▶</button>
        
        <div class="progress-container">
            <div class="time-display">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>
            <div class="progress-bar" id="progressBar">
                <div class="progress" id="progress"></div>
            </div>
        </div>
        
        <button class="control-btn" id="loopBtn">🔁</button>
    </div>
    
    <!-- 隐藏的媒体元素 -->
    <div class="hidden-media">
        <audio id="mediaPlayer" controls>
            <source src="congratulationprosperous.mp4" type="audio/mpeg">
            <source src="media/audio.ogg" type="audio/ogg">
            您的浏览器不支持音频播放
        </audio>
    </div>

    <!-- 主内容包装器 -->
    <div class="main-content">
        <!-- Background容器 -->
        <div class="background">
            <img src="background001.png" alt="背景图案">
        </div>
        
        <!-- Container容器 -->
        <div class="container">
            <div class="neon-border">
                <div class="glow"></div>
                <div class="year-3d">
                    <span class="metal-effect" data-digit="2">2</span>
                    <span class="metal-effect" data-digit="0">0</span>
                    <span class="metal-effect" data-digit="2">2</span>
                    <span class="metal-effect" data-digit="6">6</span>
                </div>
            </div>
        </div>

        <!-- Main Subtitle容器 -->
        <div class="main-subtitle">
            <div class="subtitle">Happy Spring Festival</div>
        </div>

        <!-- Logo容器 -->
        <div class="logo">
            <img src="MyCardEnglish.png" alt="CMG Logo">
        </div>
        
        <!-- 图片窗口容器 -->
        <div class="image-window">
            <!-- 原始图片（仅用于加载动画） -->
            <img src="Socialmap003.jpg" alt="展示图片1" class="original-img">
            
            <!-- ===== 新增：Teleprompter控制按钮容器 ===== -->
            <div class="teleprompter-controls" id="teleprompterControls">
                <button class="teleprompter-btn" id="scrollToggleBtn" title="播放/暂停滚动">
                    ▶
                </button>
                <button class="teleprompter-btn" id="importImageBtn" title="导入新图片">
                    📤
                </button>
            </div>
            
            <!-- Teleprompter滚动容器 - 修改为单张图片 -->
            <div class="teleprompter-wrapper loading">
                <!-- 内部容器包含单张图片 -->
                <div class="teleprompter-inner">
                    <img src="Socialmap003.jpg" alt="展示图片" class="teleprompter-img" id="mainImage">
                </div>
                
                <!-- 隐藏的文件输入 -->
                <input type="file" 
                       id="imageUploadInput" 
                       accept="image/*" 
                       style="display: none;">
                
                <!-- 进度条 -->
                <div class="teleprompter-progress">
                    <div class="time-display">
                        <span class="progress-text">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== 媒体播放器功能（完全不变） =====
        const mediaPlayer = document.getElementById('mediaPlayer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const loopBtn = document.getElementById('loopBtn');
        const progressBar = document.getElementById('progressBar');
        const progress = document.getElementById('progress');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        
        let isPlaying = false;
        let isLooping = false;
        
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }
        
        function updateProgress() {
            if (!mediaPlayer.duration) return;
            
            const percent = (mediaPlayer.currentTime / mediaPlayer.duration) * 100;
            progress.style.width = `${percent}%`;
            
            currentTimeEl.textContent = formatTime(mediaPlayer.currentTime);
            durationEl.textContent = formatTime(mediaPlayer.duration);
        }
        
        function setProgress(e) {
            const width = progressBar.clientWidth;
            const clickX = e.offsetX;
            const duration = mediaPlayer.duration;
            
            mediaPlayer.currentTime = (clickX / width) * duration;
        }
        
        function togglePlayPause() {
            if (isPlaying) {
                mediaPlayer.pause();
                playPauseBtn.textContent = '▶';
            } else {
                mediaPlayer.play().catch(e => {
                    console.log('播放被阻止:', e);
                });
                playPauseBtn.textContent = '⏸';
            }
            isPlaying = !isPlaying;
        }
        
        function toggleLoop() {
            isLooping = !isLooping;
            mediaPlayer.loop = isLooping;
            loopBtn.classList.toggle('active', isLooping);
        }
        
        mediaPlayer.addEventListener('timeupdate', updateProgress);
        mediaPlayer.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(mediaPlayer.duration);
            updateProgress();
        });
        mediaPlayer.addEventListener('ended', () => {
            if (!isLooping) {
                isPlaying = false;
                playPauseBtn.textContent = '▶';
            }
        });
        
        playPauseBtn.addEventListener('click', togglePlayPause);
        loopBtn.addEventListener('click', toggleLoop);
        progressBar.addEventListener('click', setProgress);
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlayPause();
            }
        });
        
        // ===== 重构后的TeleprompterScroller类（支持动态图片队列） =====
        class TeleprompterScroller {
            constructor(wrapper, options = {}) {
                this.wrapper = wrapper;
                this.inner = wrapper.querySelector('.teleprompter-inner');
                this.mainImage = wrapper.querySelector('.teleprompter-img');
                this.progressBar = wrapper.querySelector('.progress-bar');
                this.progress = wrapper.querySelector('.progress');
                this.progressText = wrapper.querySelector('.progress-text');
                
                // 配置参数
                this.options = {
                    scrollSpeed: 1.5,
                    autoPlay: false,
                    maxQueueLength: 10,
                    ...options
                };
                
                // 状态变量
                this.isPlaying = this.options.autoPlay;
                this.hasStarted = false;
                this.isUserScrolling = false;
                this.scrollAnimationId = null;
                
                // 图片队列（新增）
                this.imageQueue = [];
                this.currentImageIndex = 0;
                
                // 尺寸信息（简化）
                this.imageHeight = 0;
                this.containerHeight = 0;
                
                // 初始化
                this.init();
            }
            
            async init() {
                console.log('🚀 TeleprompterScroller初始化（单张图片动态队列版）');
                
                // 等待主图片加载
                await this.waitForImageLoad(this.mainImage);
                
                // 初始化图片队列
                this.initializeImageQueue();
                
                // 计算尺寸
                this.calculateDimensions();
                
                // 绑定事件
                this.bindEvents();
                
                // 显示容器
                this.wrapper.classList.remove('loading');
                this.wrapper.classList.add('loaded');
                
                console.log('✅ TeleprompterScroller初始化完成', {
                    当前图片高度: `${this.imageHeight}px`,
                    容器高度: `${this.containerHeight}px`,
                    队列长度: this.imageQueue.length
                });
            }
            
            // 简化的图片加载等待
            waitForImageLoad(img) {
                return new Promise((resolve) => {
                    if (img.complete && img.naturalHeight > 100) {
                        console.log(`📸 图片已加载: ${img.naturalHeight}px`);
                        setTimeout(resolve, 50);
                    } else {
                        img.onload = () => {
                            console.log(`📸 图片加载完成: ${img.naturalHeight}px`);
                            setTimeout(resolve, 50);
                        };
                        img.onerror = () => {
                            console.warn('图片加载失败，使用默认高度');
                            setTimeout(resolve, 50);
                        };
                    }
                    
                    setTimeout(resolve, 3000);
                });
            }
            
            // 初始化图片队列（从现有图片开始）
            initializeImageQueue() {
                if (this.mainImage && this.mainImage.src) {
                    this.imageQueue.push({
                        element: this.mainImage,
                        src: this.mainImage.src,
                        height: this.mainImage.naturalHeight || this.mainImage.clientHeight
                    });
                    console.log('📋 初始化图片队列，添加第一张图片');
                }
            }
            
            // 简化的尺寸计算
            calculateDimensions() {
                // 使用主图片高度
                const img = this.mainImage;
                this.imageHeight = img.naturalHeight > 100 ? 
                    img.naturalHeight : img.clientHeight;
                
                // 容器高度
                this.containerHeight = this.wrapper.clientHeight;
                
                console.log('📏 尺寸计算:', {
                    图片高度: this.imageHeight,
                    容器高度: this.containerHeight,
                    可滚动距离: Math.max(0, this.imageHeight - this.containerHeight)
                });
            }
            
            // 简化的进度更新
            updateProgressDisplay() {
                const scrollTop = this.wrapper.scrollTop;
                const maxScroll = Math.max(1, this.imageHeight - this.containerHeight);
                const progressPercent = (scrollTop / maxScroll) * 100;
                const roundedPercent = Math.min(100, Math.round(progressPercent));
                
                this.progress.style.width = progressPercent + '%';
                this.progressText.textContent = roundedPercent + '%';
                
                // 调试信息
                if (this.debugMode) {
                    console.log('📊 滚动进度:', {
                        滚动位置: scrollTop,
                        最大滚动: maxScroll,
                        进度: roundedPercent + '%'
                    });
                }
            }
            
            // 简化的滚动动画（不再有循环检测）
            animateScroll() {
                if (this.isPlaying) {
                    // 向上滚动
                    let scrollTop = this.wrapper.scrollTop;
                    
                    // 计算最大可滚动距离
                    const maxScroll = Math.max(0, this.imageHeight - this.containerHeight);
                    
                    // 如果还没滚动到底部，继续滚动
                    if (scrollTop < maxScroll) {
                        scrollTop += this.options.scrollSpeed;
                        this.wrapper.scrollTop = scrollTop;
                        
                        // 更新进度显示
                        this.updateProgressDisplay();
                        
                        // 继续动画
                        this.scrollAnimationId = requestAnimationFrame(() => this.animateScroll());
                    } else {
                        // 滚动到底部，暂停
                        console.log('🏁 滚动到底部，自动暂停');
                        this.pause();
                        
                        // 更新按钮状态
                        const playBtn = document.getElementById('scrollToggleBtn');
                        if (playBtn) {
                            playBtn.classList.remove('active');
                            playBtn.innerHTML = '▶';
                        }
                    }
                }
            }
            
            // ===== 新增：图片队列管理方法 =====
            
            // 添加新图片到队列顶部
            async addImageToQueue(imageFile) {
                console.log('🖼️ 开始添加新图片到队列...');
                
                // 创建临时加载提示
                this.showLoadingIndicator();
                
                try {
                    // 1. 创建新的图片元素
                    const newImage = document.createElement('img');
                    newImage.className = 'teleprompter-img new-image';
                    newImage.alt = '新导入图片';
                    
                    // 2. 读取文件为DataURL
                    const dataUrl = await this.readFileAsDataURL(imageFile);
                    
                    // 3. 等待图片加载完成
                    await new Promise((resolve, reject) => {
                        newImage.onload = () => {
                            console.log(`✅ 新图片加载成功: ${newImage.naturalWidth}x${newImage.naturalHeight}`);
                            resolve();
                        };
                        newImage.onerror = () => {
                            console.error('❌ 新图片加载失败');
                            reject(new Error('图片加载失败'));
                        };
                        newImage.src = dataUrl;
                    });
                    
                    // 4. 插入到队列顶部（DOM操作）
                    this.insertImageAtTop(newImage, dataUrl);
                    
                    // 5. 更新尺寸和滚动位置
                    this.updateAfterImageAdded(newImage);
                    
                    // 6. 如果正在播放，继续播放
                    if (this.isPlaying) {
                        this.animateScroll();
                    }
                    
                    // 7. 隐藏加载提示
                    this.hideLoadingIndicator();
                    
                    console.log('🎉 新图片成功添加到队列顶部');
                    return true;
                    
                } catch (error) {
                    console.error('添加图片失败:', error);
                    this.hideLoadingIndicator();
                    this.showError('图片添加失败: ' + error.message);
                    return false;
                }
            }
            
            // 读取文件为DataURL
            readFileAsDataURL(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.onerror = () => reject(new Error('文件读取失败'));
                    reader.readAsDataURL(file);
                });
            }
            
            // 将图片插入到DOM顶部
            insertImageAtTop(newImage, dataUrl) {
                // 创建图片包装器
                const imageWrapper = document.createElement('div');
                imageWrapper.className = 'image-item';
                imageWrapper.style.position = 'relative';
                imageWrapper.style.marginBottom = '10px';
                
                // 添加图片
                imageWrapper.appendChild(newImage);
                
                // 添加到队列数组
                this.imageQueue.unshift({
                    element: newImage,
                    src: dataUrl,
                    height: newImage.naturalHeight,
                    wrapper: imageWrapper
                });
                
                // 限制队列长度
                if (this.imageQueue.length > this.options.maxQueueLength) {
                    this.removeOldestImage();
                }
                
                // 插入到DOM
                this.inner.insertBefore(imageWrapper, this.inner.firstChild);
                
                console.log(`📊 队列更新: 当前 ${this.imageQueue.length} 张图片`);
            }
            
            // 移除最旧的图片
            removeOldestImage() {
                if (this.imageQueue.length <= 1) return;
                
                const oldest = this.imageQueue.pop();
                if (oldest.wrapper && oldest.wrapper.parentNode) {
                    oldest.wrapper.parentNode.removeChild(oldest.wrapper);
                    console.log('🗑️ 移除最旧的图片');
                }
            }
            
            // 添加图片后更新
            updateAfterImageAdded(newImage) {
                // 更新当前图片引用
                this.mainImage = newImage;
                
                // 重新计算尺寸
                this.calculateDimensions();
                
                // 重置滚动位置到顶部（显示新图片）
                this.wrapper.scrollTop = 0;
                
                // 更新进度显示
                this.updateProgressDisplay();
            }
            
            // 显示加载指示器
            showLoadingIndicator() {
                let loader = this.wrapper.querySelector('.image-loading');
                if (!loader) {
                    loader = document.createElement('div');
                    loader.className = 'image-loading';
                    loader.innerHTML = '🔄 加载中...';
                    loader.style.cssText = `
                        position: absolute;
                        top: 20px;
                        left: 50%;
                        transform: translateX(-50%);
                        background: rgba(0,0,0,0.8);
                        color: #ffd700;
                        padding: 10px 20px;
                        border-radius: 5px;
                        z-index: 100;
                    `;
                    this.wrapper.appendChild(loader);
                }
            }
            
            // 隐藏加载指示器
            hideLoadingIndicator() {
                const loader = this.wrapper.querySelector('.image-loading');
                if (loader) {
                    loader.remove();
                }
            }
            
            // 显示错误提示
            showError(message) {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'image-error';
                errorDiv.innerHTML = `❌ ${message}`;
                errorDiv.style.cssText = `
                    position: absolute;
                    top: 20px;
                    left: 50%;
                    transform: translateX(-50%);
                    background: rgba(255,0,0,0.8);
                    color: white;
                    padding: 10px 20px;
                    border-radius: 5px;
                    z-index: 100;
                `;
                
                this.wrapper.appendChild(errorDiv);
                setTimeout(() => errorDiv.remove(), 3000);
            }
            
            // ===== 原有的方法（保持不变） =====
            bindEvents() {
                // 保持原有的事件绑定逻辑
                this.wrapper.addEventListener('click', (e) => {
                    if (e.target.closest('.progress-bar')) return;
                    
                    if (this.isUserScrolling) {
                        this.isUserScrolling = false;
                        this.togglePlay();
                    } else {
                        this.togglePlay();
                    }
                });
                
                this.progressBar.addEventListener('click', (e) => {
                    const rect = e.currentTarget.getBoundingClientRect();
                    const clickX = e.clientX - rect.left;
                    const percent = clickX / rect.width;
                    
                    const maxScroll = Math.max(0, this.imageHeight - this.containerHeight);
                    const targetScroll = percent * maxScroll;
                    this.wrapper.scrollTop = targetScroll;
                    
                    this.updateProgressDisplay();
                    this.isPlaying = true;
                    this.animateScroll();
                });
                
                // 监听用户手动滚动
                let scrollTimeout;
                this.wrapper.addEventListener('scroll', () => {
                    // 更新进度显示
                    this.updateProgressDisplay();
                    
                    // 清除之前的超时
                    if (scrollTimeout) clearTimeout(scrollTimeout);
                    
                    // 如果正在自动滚动，用户开始手动滚动时暂停
                    if (this.isPlaying && !this.isUserScrolling) {
                        this.isUserScrolling = true;
                        console.log('⏸️ 用户手动滚动，暂停自动滚动');
                        this.pause();
                    }
                    
                    // 设置超时，检测滚动是否停止
                    scrollTimeout = setTimeout(() => {
                        if (this.isUserScrolling) {
                            console.log('🔄 用户滚动停止');
                        }
                    }, 100);
                });
                
                // 监听触摸开始
                this.wrapper.addEventListener('touchstart', (e) => {
                    if (this.isPlaying && !this.isUserScrolling) {
                        this.isUserScrolling = true;
                        this.pause();
                    }
                });
            }
            
            togglePlay() {
                if (!this.hasStarted) {
                    this.hasStarted = true;
                    this.isPlaying = true;
                    console.log('▶️ 开始自动滚动');
                    this.animateScroll();
                } else {
                    this.isPlaying = !this.isPlaying;
                    console.log(this.isPlaying ? '▶️ 恢复播放' : '⏸️ 暂停播放');
                    
                    if (this.isPlaying) {
                        this.animateScroll();
                    } else {
                        cancelAnimationFrame(this.scrollAnimationId);
                    }
                }
            }
            
            play() { 
                if (!this.hasStarted) this.hasStarted = true;
                this.isPlaying = true; 
                this.animateScroll();
            }
            
            pause() { 
                this.isPlaying = false; 
                cancelAnimationFrame(this.scrollAnimationId);
            }
            
            // 调试方法
            enableDebug() {
                this.debugMode = true;
                console.log('🔧 调试模式已启用');
            }
            
            getStatus() {
                return {
                    isPlaying: this.isPlaying,
                    hasStarted: this.hasStarted,
                    isUserScrolling: this.isUserScrolling,
                    scrollTop: this.wrapper.scrollTop,
                    imageHeight: this.imageHeight,
                    containerHeight: this.containerHeight,
                    queueLength: this.imageQueue.length,
                    progress: this.progressText.textContent
                };
            }
        }
        
        // ===== 原有的页面交互功能（完全不变） =====
        document.querySelector('.year-3d').addEventListener('mousemove', function(e) {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            
            this.style.transform = `rotateX(${15 + yAxis}deg) rotateY(${xAxis}deg)`;
        });
        
        document.querySelector('.year-3d').addEventListener('click', function() {
            this.style.animation = 'none';
            this.style.transform = 'rotateX(20deg) rotateY(20deg) scale(1.1)';
            
            setTimeout(() => {
                this.style.animation = 'float 6s ease-in-out infinite';
            }, 500);
        });
        
        // ===== 初始化页面 =====
        document.addEventListener('DOMContentLoaded', function() {
            console.log('='.repeat(60));
            console.log('🚀 页面加载完成，开始初始化...');
            console.log('='.repeat(60));
            
            // 数字逐个出现效果
            const digits = document.querySelectorAll('.year-3d span');
            digits.forEach((digit, index) => {
                digit.style.opacity = '0';
                digit.style.transform = 'translateY(50px)';
                
                setTimeout(() => {
                    digit.style.transition = 'opacity 0.8s ease, transform 0.8s ease';
                    digit.style.opacity = '1';
                    digit.style.transform = 'translateY(0)';
                }, index * 200);
            });
            
            // logo图片加载动画
            const logoImg = document.querySelector('.logo img');
            if (logoImg) {
                logoImg.style.opacity = '0';
                logoImg.style.transform = 'translateY(30px)';
                
                setTimeout(() => {
                    logoImg.style.transition = 'opacity 1s ease, transform 1s ease';
                    logoImg.style.opacity = '1';
                    logoImg.style.transform = 'translateY(0)';
                }, 1000);
            }
            
            // 初始化媒体播放器
            updateProgress();
            
            // 延迟初始化teleprompter滚动器和按钮
            setTimeout(() => {
                console.log('\n📊 初始化TeleprompterScroller和功能按钮...');
                const teleprompterWrapper = document.querySelector('.teleprompter-wrapper');
                
                if (teleprompterWrapper) {
                    // 创建支持动态队列的滚动器
                    const scroller = new TeleprompterScroller(teleprompterWrapper, {
                        scrollSpeed: 1.5,
                        autoPlay: false,
                        maxQueueLength: 10
                    });
                    
                    // ===== 按钮控制逻辑 =====
                    const scrollToggleBtn = document.getElementById('scrollToggleBtn');
                    const importImageBtn = document.getElementById('importImageBtn');
                    const uploadInput = document.getElementById('imageUploadInput');
                    
                    // 播放/暂停按钮
                    if (scrollToggleBtn) {
                        scrollToggleBtn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            scroller.togglePlay();
                            this.classList.toggle('active', scroller.isPlaying);
                            this.innerHTML = scroller.isPlaying ? '⏸' : '▶';
                        });
                    }
                    
                    // 导入图片按钮
                    if (importImageBtn && uploadInput) {
                        importImageBtn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            uploadInput.click();
                        });
                        
                        // 文件选择变化事件
                        uploadInput.addEventListener('change', function(e) {
                            const file = e.target.files[0];
                            if (!file) return;
                            
                            // 验证文件类型
                            if (!file.type.match('image.*')) {
                                alert('请选择图片文件！');
                                return;
                            }
                            
                            // 验证文件大小（限制5MB）
                            if (file.size > 5 * 1024 * 1024) {
                                alert('图片大小不能超过5MB！');
                                return;
                            }
                            
                            console.log('📁 选择的图片:', file.name, file.type, (file.size/1024).toFixed(1) + 'KB');
                            
                            // 添加到滚动队列
                            scroller.addImageToQueue(file)
                                .then(success => {
                                    if (success) {
                                        // 自动开始播放
                                        if (!scroller.isPlaying) {
                                            scroller.play();
                                            if (scrollToggleBtn) {
                                                scrollToggleBtn.classList.add('active');
                                                scrollToggleBtn.innerHTML = '⏸';
                                            }
                                        }
                                    }
                                });
                            
                            // 清空input，允许重复选择同一文件
                            uploadInput.value = '';
                        });
                    }
                    
                    // 保存到全局，方便调试
                    window.teleprompterScroller = scroller;
                    
                    // 添加调试命令
                    window.debugScroller = function() {
                        console.group('🔍 TeleprompterScroller 状态');
                        const status = scroller.getStatus();
                        console.table(status);
                        console.groupEnd();
                        return status;
                    };
                    
                    // 添加控制命令
                    window.scrollerControls = {
                        play: () => {
                            scroller.play();
                            if (scrollToggleBtn) {
                                scrollToggleBtn.classList.add('active');
                                scrollToggleBtn.innerHTML = '⏸';
                            }
                        },
                        pause: () => {
                            scroller.pause();
                            if (scrollToggleBtn) {
                                scrollToggleBtn.classList.remove('active');
                                scrollToggleBtn.innerHTML = '▶';
                            }
                        },
                        toggle: () => {
                            scroller.togglePlay();
                            if (scrollToggleBtn) {
                                scrollToggleBtn.classList.toggle('active', scroller.isPlaying);
                                scrollToggleBtn.innerHTML = scroller.isPlaying ? '⏸' : '▶';
                            }
                        },
                        addImage: (file) => scroller.addImageToQueue(file),
                        getStatus: () => scroller.getStatus(),
                        enableDebug: () => scroller.enableDebug()
                    };
                    
                    console.log('\n🎮 可用调试命令:');
                    console.log('   debugScroller()            - 查看滚动器状态');
                    console.log('   scrollerControls.play()    - 开始滚动');
                    console.log('   scrollerControls.pause()   - 暂停滚动');
                    console.log('   scrollerControls.toggle()  - 切换播放状态');
                    console.log('   scrollerControls.addImage(file) - 添加图片');
                    
                    console.log('\n💡 用户交互提示:');
                    console.log('   1. 点击▶/⏸按钮控制滚动播放/暂停');
                    console.log('   2. 点击📤按钮导入新图片到队列顶部');
                    console.log('   3. 可以用手指/鼠标直接拖拽滚动图片');
                    console.log('   4. 拖拽滚动时会暂停自动滚动，需要再次点击恢复');
                    console.log('   5. 最多保留10张图片，旧的会自动移除');
                    
                    console.log('\n✅ TeleprompterScroller初始化完成，支持动态图片队列');
                    
                } else {
                    console.error('❌ 找不到teleprompter-wrapper元素');
                }
            }, 2000);
        });
    </script>
</body>
</html>
