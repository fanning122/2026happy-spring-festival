<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMG Happy Spring Festival</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: 'Arial Black', 'Arial', sans-serif;
            overflow: auto;
            padding: 20px;
            position: relative;
            padding-top: 0;
        }
        
        /* 媒体播放器控制栏样式 */
        .media-player {
            position: fixed;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 580px;
            height: 50px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }
        
        .control-btn {
            background: linear-gradient(135deg, #ffd700, #daa520);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }
        
        .control-btn:hover {
            transform: scale(1.1);
            background: linear-gradient(135deg, #ffec8b, #ffd700);
        }
        
        .control-btn.active {
            background: linear-gradient(135deg, #ff4500, #ff6347);
            color: white;
        }
        
        .progress-container {
            flex: 1;
            margin: 0 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .time-display {
            display: flex;
            justify-content: space-between;
            width: 100%;
            color: #ffd700;
            font-size: 12px;
            margin-bottom: 5px;
            font-family: monospace;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 215, 0, 0.3);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .progress {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ff4500);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
        }
        
        .progress-bar:hover .progress {
            background: linear-gradient(90deg, #ffec8b, #ff6347);
        }
        
        .hidden-media {
            display: none;
            position: absolute;
            top: -9999px;
            left: -9999px;
        }
        
        @media (max-width: 768px) {
            .media-player {
                width: 90%;
                max-width: 580px;
            }
        }
        
        @media (max-width: 480px) {
            .media-player {
                width: 95%;
                height: 45px;
                padding: 0 10px;
            }
            
            .control-btn {
                width: 35px;
                height: 35px;
                font-size: 16px;
            }
            
            .time-display {
                font-size: 10px;
            }
        }
        
        .container {
            perspective: 1000px;
            text-align: center;
            margin-bottom: 0px;
        }
        
        .year-3d {
            display: inline-block;
            font-size: 180px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 
                5px 5px 0 rgba(0, 0, 0, 0.3),
                10px 10px 20px rgba(0, 0, 0, 0.5);
            transform-style: preserve-3d;
            animation: float 6s ease-in-out infinite;
            letter-spacing: 15px;
        }
        
        .year-3d span {
            display: inline-block;
            position: relative;
            text-transform: uppercase;
            transform-style: preserve-3d;
        }
        
        .year-3d span::before,
        .year-3d span::after {
            content: attr(data-digit);
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
        }
        
        .year-3d span::before {
            color: rgba(255, 215, 0, 0.5);
            transform: translateZ(-30px);
            z-index: -1;
        }
        
        .year-3d span::after {
            color: rgba(255, 140, 0, 0.7);
            transform: translateZ(-15px);
            z-index: -2;
        }
        
        .neon-border {
            position: relative;
            padding: 20px;
            border-radius: 20px;
        }
        
        .metal-effect {
            background: linear-gradient(
                135deg,
                #ffd700 0%,
                #ffec8b 25%,
                #ffd700 50%,
                #daa520 75%,
                #b8860b 100%
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            background-size: 200% auto;
            animation: shine 3s linear infinite;
        }
        
        @keyframes float {
            0%, 100% {
                transform: rotateX(15deg) rotateY(0deg) translateY(0);
            }
            50% {
                transform: rotateX(15deg) rotateY(10deg) translateY(-20px);
            }
        }
        
        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }
        
        @media (max-width: 768px) {
            .year-3d {
                font-size: 120px;
                letter-spacing: 3px;
            }
        }
        
        @media (max-width: 480px) {
            .year-3d {
                font-size: 80px;
                letter-spacing: 0px;
            }
        }
        
        .glow {
            animation: pulse 4s ease-in-out infinite;
            z-index: -1;
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 0.3;
            }
            50% {
                opacity: 0.7;
            }
        }
        
        .logo {
            text-align: center;
            margin-top: -24px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .logo img {
            max-width: 580px;
            width: 100%;
            height: auto;
            border-radius: 0px;
            transition: transform 0.3s ease;
        }
        
        .logo img:hover {
            transform: scale(1.02);
        }
        
        @media (max-width: 768px) {
            .logo img {
                max-width: 450px;
            }
        }
        
        @media (max-width: 480px) {
            .logo img {
                max-width: 380px;
            }
        }
        
        .background {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            width: 100%;
            text-align: center;
            pointer-events: none;
        }
        
        .background img {
            max-width: 680px;
            width: 90%;
            height: auto;
            opacity: 1;
            filter: none;
        }
        
        .background {
            top: 380px;
        }
        
        @media (max-width: 768px) {
            .background {margin-top: auto;}
            .background img {
                max-width: 450px;
                opacity: 1;
            }
        }
        
        @media (max-width: 480px) {
            .background {top: 180px;}
            .logo {
                margin-top: -110px;
            }
            .background img {
                max-width: 350px;
                opacity: 1;
            }
        }
        
        .main-subtitle {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 120px;
        }
        
        .subtitle {
            color: red;
            font-size: 50px;
            opacity: 0.88;
            position: relative;
            transform-origin: center top;
            z-index: 1;
            animation: 
                subtitleEnter 2s ease-out 1.5s both,
                subtitleLoop 5s ease-in-out 3.5s infinite;
        }
        
        @keyframes subtitleEnter {
            0% {
                transform: translateY(100px) scale(1);
                opacity: 0;
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 0.88;
            }
        }
        
        @keyframes subtitleLoop {
            0% {
                transform: scale(1);
                opacity: 0.88;
            }
            60% {
                transform: scale(3);
                opacity: 0.88;
            }
            60%, 79.999% {
                transform: scale(3.2);
                opacity: 0;
            }
            80% {
                transform: scale(1);
                opacity: 0;
            }
            90% {
                transform: scale(1);
                opacity: 0.44;
            }
            100% {
                transform: scale(1);
                opacity: 0.88;
            }
        }
        
        @media (max-width: 480px) {
            .subtitle {
                top: -70px;
                font-size: 29px;
            }
        }
        
        .main-content {
            position: absolute;
            top: -2vh;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
        }
        
        @media (max-width: 768px) {
            .main-content {
                top: 30vh;
            }
        }
        
        @media (max-width: 480px) {
            .main-content {
                top: 2vh;
            }
        }
        
        /* ===== 修改：图片窗口容器样式 ===== */
        .image-window {
            margin-top: -80px;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            background: transparent;
            gap: 0;
            position: relative;
            z-index: -2;
        }
        
        /* 原始图片（仅用于加载动画） */
        .image-window .original-img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            opacity: 0;
            position: absolute;
            z-index: -1;
        }
        
        /* ===== TELEPROMPTER 滚动样式 ===== */
        .teleprompter-wrapper {
            position: relative;
            width: 430px;
            height: 500px;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            background: #000;
            touch-action: none;
            cursor: default;
            margin: 0 auto;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        .teleprompter-wrapper.loaded {
            opacity: 1;
        }
        
        .teleprompter-inner {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            will-change: transform;
        }
        
        .teleprompter-img-container {
            display: flex;
            flex-direction: column;
        }
        
        .teleprompter-img-container img {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none;
            user-select: none;
            flex-shrink: 0;
        }
        
        /* 进度条容器 - 复用播放器样式 */
        .teleprompter-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, rgba(15, 32, 39, 0.9), transparent);
            padding: 10px 15px;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .teleprompter-wrapper:hover .teleprompter-progress {
            opacity: 1;
        }
        
        .teleprompter-progress .time-display {
            margin-bottom: 0;
            justify-content: center;
        }
        
        .teleprompter-progress .progress-bar {
            margin-top: 5px;
            height: 4px;
            background: rgba(255, 215, 0, 0.3);
            border-radius: 2px;
        }
        
        .teleprompter-progress .progress {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ff4500);
            border-radius: 2px;
        }
        
        /* iOS启动提示 */
        .ios-start-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            color: #ffd700;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            z-index: 100;
            border: 2px solid #ffd700;
            text-align: center;
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.3);
            animation: pulse-hint 2s infinite;
            backdrop-filter: blur(5px);
            display: none;
        }
        
        @keyframes pulse-hint {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.05); }
        }
        
        /* 响应式调整 */
        @media (max-width: 768px) {
            .image-window {
                max-width: 100vw;
                margin-left: calc(-50vw + 50%);
            }
        }
        
        @media (max-width: 480px) {
            .image-window {
                margin-top: -60px;
                width: 100vw;
                margin-left: calc(-50vw + 50%);
            }
            
            .teleprompter-wrapper {
                width: 90vw;
                max-width: 430px;
                height: 500px;
            }
            
            .ios-start-hint {
                font-size: 16px;
                padding: 12px 20px;
            }
        }
        
        /* 桌面端图片最大宽度限制 */
        @media (min-width: 769px) {
            .image-window img {
                max-width: 580px;
            }
            
            .teleprompter-wrapper {
                max-width: 430px;
            }
        }
    </style>
</head>
<body>
    <!-- 媒体播放器控制栏 -->
    <div class="media-player">
        <button class="control-btn" id="playPauseBtn">▶</button>
        
        <div class="progress-container">
            <div class="time-display">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>
            <div class="progress-bar" id="progressBar">
                <div class="progress" id="progress"></div>
            </div>
        </div>
        
        <button class="control-btn" id="loopBtn">🔁</button>
    </div>
    
    <!-- 隐藏的媒体元素 -->
    <div class="hidden-media">
        <audio id="mediaPlayer" controls>
            <source src="congratulationprosperous.mp4" type="audio/mpeg">
            <source src="media/audio.ogg" type="audio/ogg">
            您的浏览器不支持音频播放
        </audio>
    </div>

    <!-- 主内容包装器 -->
    <div class="main-content">
        <!-- Background容器 -->
        <div class="background">
            <img src="background001.png" alt="背景图案">
        </div>
        
        <!-- Container容器 -->
        <div class="container">
            <div class="neon-border">
                <div class="glow"></div>
                <div class="year-3d">
                    <span class="metal-effect" data-digit="2">2</span>
                    <span class="metal-effect" data-digit="0">0</span>
                    <span class="metal-effect" data-digit="2">2</span>
                    <span class="metal-effect" data-digit="6">6</span>
                </div>
            </div>
        </div>

        <!-- Main Subtitle容器 -->
        <div class="main-subtitle">
            <div class="subtitle">Happy Spring Festival</div>
        </div>

        <!-- Logo容器 -->
        <div class="logo">
            <img src="MyCardEnglish.png" alt="CMG Logo">
        </div>
        
        <!-- 图片窗口容器 - 包含teleprompter滚动效果 -->
        <div class="image-window">
            <!-- 原始图片（仅用于加载动画） -->
            <img src="Socialmap003.jpg" alt="展示图片1" class="original-img">
            
            <!-- Teleprompter滚动容器 -->
            <div class="teleprompter-wrapper loading">
                <div class="teleprompter-inner">
                    <div class="teleprompter-img-container">
                        <!-- 两张相同图片实现无缝循环 -->
                        <img src="Socialmap003.jpg" alt="展示图片1" class="teleprompter-img-1">
                        <img src="Socialmap003.jpg" alt="展示图片1" class="teleprompter-img-2">
                    </div>
                </div>
                
                <!-- 进度条（复用播放器样式） -->
                <div class="teleprompter-progress">
                    <div class="time-display">
                        <span class="progress-text">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress"></div>
                    </div>
                </div>
                
                <!-- iOS启动提示（默认隐藏） -->
                <div class="ios-start-hint">👆 点击开始滚动</div>
            </div>
        </div>
    </div>

    <script>
        // ===== 媒体播放器功能 =====
        const mediaPlayer = document.getElementById('mediaPlayer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const loopBtn = document.getElementById('loopBtn');
        const progressBar = document.getElementById('progressBar');
        const progress = document.getElementById('progress');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        
        let isPlaying = false;
        let isLooping = false;
        
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }
        
        function updateProgress() {
            if (!mediaPlayer.duration) return;
            
            const percent = (mediaPlayer.currentTime / mediaPlayer.duration) * 100;
            progress.style.width = `${percent}%`;
            
            currentTimeEl.textContent = formatTime(mediaPlayer.currentTime);
            durationEl.textContent = formatTime(mediaPlayer.duration);
        }
        
        function setProgress(e) {
            const width = progressBar.clientWidth;
            const clickX = e.offsetX;
            const duration = mediaPlayer.duration;
            
            mediaPlayer.currentTime = (clickX / width) * duration;
        }
        
        function togglePlayPause() {
            if (isPlaying) {
                mediaPlayer.pause();
                playPauseBtn.textContent = '▶';
            } else {
                mediaPlayer.play().catch(e => {
                    console.log('播放被阻止:', e);
                });
                playPauseBtn.textContent = '⏸';
            }
            isPlaying = !isPlaying;
        }
        
        function toggleLoop() {
            isLooping = !isLooping;
            mediaPlayer.loop = isLooping;
            loopBtn.classList.toggle('active', isLooping);
        }
        
        mediaPlayer.addEventListener('timeupdate', updateProgress);
        mediaPlayer.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(mediaPlayer.duration);
            updateProgress();
        });
        mediaPlayer.addEventListener('ended', () => {
            if (!isLooping) {
                isPlaying = false;
                playPauseBtn.textContent = '▶';
            }
        });
        
        playPauseBtn.addEventListener('click', togglePlayPause);
        loopBtn.addEventListener('click', toggleLoop);
        progressBar.addEventListener('click', setProgress);
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlayPause();
            }
        });
        
        // ===== TELEPROMPTER 滚动控制器 - 修复版 =====
        class TeleprompterScroller {
            constructor(wrapper, options = {}) {
                this.wrapper = wrapper;
                this.inner = wrapper.querySelector('.teleprompter-inner');
                this.imgContainer = wrapper.querySelector('.teleprompter-img-container');
                this.progressBar = wrapper.querySelector('.progress-bar');
                this.progress = wrapper.querySelector('.progress');
                this.progressText = wrapper.querySelector('.progress-text');
                this.iosHint = wrapper.querySelector('.ios-start-hint');
                
                // ===== 可调节参数 =====
                this.options = {
                    totalSeconds: 60,          // 总滚动时间（秒）- 滚动单张图片的时间
                    autoPlay: false,           // 初始不自动播放
                    ...options
                };
                
                this.imgs = this.imgContainer.querySelectorAll('img');
                this.isPlaying = this.options.autoPlay;
                this.hasStarted = false;
                
                // 滚动状态
                this.currentY = 0;
                this.animationId = null;
                
                // 系统检测
                this.isIOSDevice = this.detectIOS();
                this.useTopPositioning = this.isIOSDevice; // iOS使用top定位
                
                // 尺寸信息
                this.containerHeight = 0;
                this.singleImgHeight = 0;
                
                // 初始化
                this.init();
            }
            
            detectIOS() {
                return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            }
            
            async init() {
                console.log('Teleprompter初始化开始，iOS设备:', this.isIOSDevice);
                
                // 显示iOS提示
                if (this.isIOSDevice && this.iosHint) {
                    this.iosHint.style.display = 'block';
                }
                
                // 等待图片加载
                await this.waitForImages();
                
                // 计算关键尺寸
                this.calculateDimensions();
                
                // 应用系统特定的CSS
                this.applySystemSpecificCSS();
                
                // 设置初始位置
                this.resetPosition();
                
                // 绑定简单事件
                this.bindSimpleEvents();
                
                // 显示容器
                this.wrapper.classList.remove('loading');
                this.wrapper.classList.add('loaded');
                
                console.log('Teleprompter初始化完成');
                console.log('关键尺寸:', {
                    容器高度: this.containerHeight,
                    单张图片高度: this.singleImgHeight,
                    滚动速度: this.scrollSpeed + 'px/帧'
                });
            }
            
            waitForImages() {
                return new Promise((resolve) => {
                    let loadedCount = 0;
                    const totalImages = this.imgs.length;
                    
                    const checkLoaded = () => {
                        loadedCount++;
                        if (loadedCount >= totalImages) {
                            setTimeout(resolve, 100);
                        }
                    };
                    
                    Array.from(this.imgs).forEach(img => {
                        if (img.complete && img.naturalHeight > 100) {
                            checkLoaded();
                        } else {
                            img.onload = checkLoaded;
                            img.onerror = checkLoaded;
                        }
                    });
                    
                    setTimeout(resolve, 5000);
                });
            }
            
            calculateDimensions() {
                // 容器高度
                this.containerHeight = this.wrapper.clientHeight;
                
                // 单张图片高度 - 优先使用naturalHeight
                const img = this.imgs[0];
                if (img && img.naturalHeight > 100) {
                    this.singleImgHeight = img.naturalHeight;
                } else if (img && img.clientHeight > 100) {
                    this.singleImgHeight = img.clientHeight;
                } else {
                    // 备用高度
                    this.singleImgHeight = 6609.25;
                }
                
                // 关键修复：计算滚动速度
                // totalSeconds = 滚动单张图片所需时间
                // 每秒60帧，总帧数 = totalSeconds * 60
                // 每帧移动距离 = 单张图片高度 / 总帧数
                const totalFrames = this.options.totalSeconds * 60;
                this.scrollSpeed = this.singleImgHeight / totalFrames;
                
                console.log('尺寸计算:');
                console.log('- 容器高度:', this.containerHeight);
                console.log('- 单张图片高度:', this.singleImgHeight);
                console.log('- 滚动总时间:', this.options.totalSeconds, '秒');
                console.log('- 滚动速度:', this.scrollSpeed.toFixed(4), 'px/帧');
            }
            
            applySystemSpecificCSS() {
                if (this.useTopPositioning) {
                    // iOS: 使用top定位
                    this.inner.style.position = 'absolute';
                    this.inner.style.top = '0px';
                    this.inner.style.transform = 'none';
                } else {
                    // 其他系统: 使用transform
                    this.inner.style.transform = 'translateY(0px)';
                }
            }
            
            resetPosition() {
                this.currentY = 0;
                this.updatePosition();
            }
            
            updatePosition() {
                // 关键修复：循环检测 - 在正确的位置触发
                // 当第一张图片底部接近容器顶部时，重置位置
                // 计算：单张图片高度 - 容器高度 = 触发循环的位置
                const triggerPoint = this.singleImgHeight - this.containerHeight;
                
                if (this.currentY <= -triggerPoint) {
                    console.log('循环触发: currentY =', this.currentY, '触发点 =', -triggerPoint);
                    this.currentY += this.singleImgHeight;
                }
                
                // 应用位置
                if (this.useTopPositioning) {
                    // iOS: 使用top
                    this.inner.style.top = this.currentY + 'px';
                } else {
                    // 其他: 使用transform
                    this.inner.style.transform = 'translateY(' + this.currentY + 'px)';
                }
                
                // 更新进度
                this.updateProgress();
            }
            
            updateProgress() {
                if (this.singleImgHeight <= 0) return;
                
                // 计算基于单张图片的进度
                // 注意：currentY是负值，我们取绝对值
                const absoluteY = Math.abs(this.currentY);
                const progressInSingleImage = (absoluteY % this.singleImgHeight) / this.singleImgHeight;
                let percent = progressInSingleImage * 100;
                
                // 处理边界情况
                if (percent < 0) percent = 0;
                if (percent > 100) percent = 100;
                
                this.progress.style.width = percent + '%';
                this.progressText.textContent = Math.round(percent) + '%';
            }
            
            bindSimpleEvents() {
                // 单击切换播放/暂停
                this.wrapper.addEventListener('click', (e) => {
                    if (e.target.closest('.progress-bar')) return;
                    if (e.target.closest('.ios-start-hint')) return;
                    
                    this.togglePlay();
                });
                
                // iOS提示点击
                if (this.iosHint) {
                    this.iosHint.addEventListener('click', () => {
                        this.startScrolling();
                        this.iosHint.style.display = 'none';
                    });
                }
                
                // 进度条点击
                this.progressBar.addEventListener('click', (e) => {
                    const rect = e.currentTarget.getBoundingClientRect();
                    const clickX = e.clientX - rect.left;
                    const percent = clickX / rect.width;
                    
                    // 计算对应的位置
                    this.currentY = - (this.singleImgHeight * percent);
                    this.updatePosition();
                    this.isPlaying = true;
                    this.animate();
                });
                
                // 全局点击启动（iOS需要）
                if (this.isIOSDevice) {
                    document.addEventListener('click', () => {
                        if (!this.hasStarted) {
                            this.startScrolling();
                        }
                    }, { once: true });
                }
            }
            
            startScrolling() {
                if (!this.hasStarted) {
                    console.log('开始滚动...');
                    this.hasStarted = true;
                    this.isPlaying = true;
                    
                    if (this.iosHint) {
                        this.iosHint.style.display = 'none';
                    }
                    
                    this.animate();
                }
            }
            
            togglePlay() {
                this.isPlaying = !this.isPlaying;
                console.log('播放状态:', this.isPlaying ? '播放' : '暂停');
                
                if (this.isPlaying) {
                    this.animate();
                } else {
                    cancelAnimationFrame(this.animationId);
                }
            }
            
            // ===== 核心动画函数 - 借鉴有效teleprompter的逻辑 =====
            animate() {
                if (this.isPlaying) {
                    // 简单的位置递增 - 借鉴有效teleprompter的核心逻辑
                    this.currentY -= this.scrollSpeed;
                    
                    // 更新位置（包含循环检测）
                    this.updatePosition();
                    
                    // 继续动画循环
                    this.animationId = requestAnimationFrame(() => this.animate());
                }
            }
            
            // 公共方法
            play() { 
                this.isPlaying = true; 
                this.animate();
            }
            
            pause() { 
                this.isPlaying = false; 
                cancelAnimationFrame(this.animationId);
            }
            
            destroy() {
                cancelAnimationFrame(this.animationId);
            }
        }
        
        // ===== 原有的页面交互功能 =====
        document.querySelector('.year-3d').addEventListener('mousemove', function(e) {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            
            this.style.transform = `rotateX(${15 + yAxis}deg) rotateY(${xAxis}deg)`;
        });
        
        document.querySelector('.year-3d').addEventListener('click', function() {
            this.style.animation = 'none';
            this.style.transform = 'rotateX(20deg) rotateY(20deg) scale(1.1)';
            
            setTimeout(() => {
                this.style.animation = 'float 6s ease-in-out infinite';
            }, 500);
        });
        
        // ===== 初始化页面 =====
        document.addEventListener('DOMContentLoaded', function() {
            console.log('页面加载完成，开始初始化...');
            
            // 数字逐个出现效果
            const digits = document.querySelectorAll('.year-3d span');
            digits.forEach((digit, index) => {
                digit.style.opacity = '0';
                digit.style.transform = 'translateY(50px)';
                
                setTimeout(() => {
                    digit.style.transition = 'opacity 0.8s ease, transform 0.8s ease';
                    digit.style.opacity = '1';
                    digit.style.transform = 'translateY(0)';
                }, index * 200);
            });
            
            // logo图片加载动画
            const logoImg = document.querySelector('.logo img');
            if (logoImg) {
                logoImg.style.opacity = '0';
                logoImg.style.transform = 'translateY(30px)';
                
                setTimeout(() => {
                    logoImg.style.transition = 'opacity 1s ease, transform 1s ease';
                    logoImg.style.opacity = '1';
                    logoImg.style.transform = 'translateY(0)';
                }, 1000);
            }
            
            // 背景图片加载动画
            const bgImg = document.querySelector('.background img');
            if (bgImg) {
                bgImg.style.opacity = '0';
                bgImg.style.transition = 'opacity 1s ease';
                
                setTimeout(() => {
                    bgImg.style.opacity = '1';
                }, 500);
            }
            
            // 延迟初始化teleprompter（等待页面动画）
            setTimeout(() => {
                console.log('初始化Teleprompter...');
                const teleprompterWrapper = document.querySelector('.teleprompter-wrapper');
                
                if (teleprompterWrapper) {
                    // ===== 在此修改滚动参数 =====
                    const teleprompter = new TeleprompterScroller(teleprompterWrapper, {
                        totalSeconds: 60,      // 修改这里：单张图片滚动时间（秒）
                        autoPlay: false        // 设为false，等待用户交互
                    });
                    
                    // 保存到全局，方便调试
                    window.teleprompter = teleprompter;
                    
                    // 添加调试命令
                    window.debugTeleprompter = function() {
                        console.log('=== Teleprompter 调试信息 ===');
                        console.log('isPlaying:', teleprompter.isPlaying);
                        console.log('hasStarted:', teleprompter.hasStarted);
                        console.log('currentY:', teleprompter.currentY);
                        console.log('containerHeight:', teleprompter.containerHeight);
                        console.log('singleImgHeight:', teleprompter.singleImgHeight);
                        console.log('scrollSpeed:', teleprompter.scrollSpeed);
                        console.log('useTopPositioning:', teleprompter.useTopPositioning);
                        console.log('isIOS:', teleprompter.isIOSDevice);
                        console.log('=== 调试结束 ===');
                    };
                    
                    console.log('Teleprompter初始化完成');
                    console.log('提示：点击teleprompter区域开始/暂停滚动');
                    console.log('在控制台输入 debugTeleprompter() 查看状态');
                    
                    // 5秒后如果还没开始，自动尝试（非iOS）
                    if (!teleprompter.isIOSDevice) {
                        setTimeout(() => {
                            if (!teleprompter.hasStarted) {
                                console.log('5秒后自动开始滚动');
                                teleprompter.startScrolling();
                            }
                        }, 5000);
                    }
                } else {
                    console.error('找不到teleprompter-wrapper元素');
                }
            }, 2000); // 延迟2秒开始初始化
            
            // 初始化媒体播放器
            updateProgress();
        });
    </script>
</body>
</html>
